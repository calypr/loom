schema:
  - graphqlapi/schema.graphqls
  - graphqlapi/fhir_schema.graphqls

exec:
  filename: graphqlapi/generated.go
  package: graphqlapi

model:
  filename: graphqlapi/model/models.go
  package: model

resolver:
  layout: follow-schema
  dir: graphqlapi
  package: graphqlapi

skip_mod_tidy: true
# The generated JSON scalar unmarshaller needs the post-generation correction
# in cmd/gqlgenfix. Skip gqlgen's pre-generation package validation so that
# correction can be applied before the package is compiled.
skip_validation: true
struct_tag: gqlgen

autobind:
  - github.com/calypr/loom/fhirstructs

models:
  JSON:
    model:
      - encoding/json.RawMessage
