schema:
  - graphqlapi/schema.graphqls

exec:
  filename: graphqlapi/generated.go
  package: graphqlapi

model:
  filename: graphqlapi/model/models.go
  package: model

resolver:
  layout: follow-schema
  dir: graphqlapi
  package: graphqlapi

skip_mod_tidy: true

models:
  JSON:
    model:
      - encoding/json.RawMessage
