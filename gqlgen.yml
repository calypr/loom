schema:
  - internal/api/graphql/graph/schema/schema.graphqls

exec:
  layout: follow-schema
  dir: generated/graphql/graph/executor
  filename_template: "{name}.generated.go"
  package: executor

model:
  filename: generated/graphql/graph/model/models.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/api/graphql/graph/resolver
  package: resolver

skip_mod_tidy: true
# The generated JSON scalar unmarshaller needs the post-generation correction
# in cmd/gqlgenfix. Skip gqlgen's pre-generation package validation so that
# correction can be applied before the package is compiled.
skip_validation: true

models:
  JSON:
    model:
      - encoding/json.RawMessage
  DataframeAggregateInput:
    model: github.com/calypr/loom/internal/api/dataframe.DataframeAggregateInput
  DataframeAggregationSpecInput:
    model: github.com/calypr/loom/internal/api/dataframe.DataframeAggregationSpecInput
  DataframeAggregationsInput:
    model: github.com/calypr/loom/internal/api/dataframe.DataframeAggregationsInput
  DataframeColumn:
    model: github.com/calypr/loom/internal/api/dataframe.DataframeColumn
  DataframeDatasetInput:
