schema:
  - internal/api/graphql/graph/schema/schema.graphqls
  - generated/graphql/graph/schema/fhir_schema.graphqls

exec:
  layout: follow-schema
  dir: generated/graphql/graph/executor
  filename_template: "{name}.generated.go"
  package: executor

model:
  filename: generated/graphql/graph/model/models.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/api/graphql/graph/resolver
  package: resolver

skip_mod_tidy: true
skip_validation: true
struct_tag: gqlgen

autobind:
  - github.com/calypr/loom/generated/fhir

models:
  JSON:
    model:
      - encoding/json.RawMessage
