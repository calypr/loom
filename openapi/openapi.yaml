        anchorFields:
          type: array
          items: {$ref: '#/components/schemas/TemporalFieldChoice'}
    UnitNormalizationCapabilities:
      type: object
      additionalProperties: false
      required: [available, presets]
      properties:
        available: {type: boolean}
        reasonCode: {type: string}
        reason: {type: string}
        presets:
          type: array
          items: {$ref: '#/components/schemas/UnitNormalizationPresetCapability'}
    UnitNormalizationPresetCapability:
      type: object
      additionalProperties: false
      required: [policyId, version, target, available]
      properties:
        policyId: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        target: {$ref: '#/components/schemas/UnitIdentity'}
        available: {type: boolean}
        reasonCode: {type: string}
        reason: {type: string}
    ValueTransformationCapability:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available: {type: boolean}
        reasonCode: {type: string}
        reason: {type: string}
    ColumnValueTransformationCapabilities:
      type: object
      additionalProperties: false
      required: [exactCategoryRecode, codedValueRecoding]
