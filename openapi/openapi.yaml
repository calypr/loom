    RowDefinitionExpandedSelection:
      type: object
      additionalProperties: false
      required: [kind, expanded]
      properties:
        kind: {type: string, enum: [EXPANDED]}
        expanded:
          type: object
          additionalProperties: false
          required: [rowChoiceId, emptyCollectionPolicy]
          properties:
            rowChoiceId: {type: string, minLength: 1}
            emptyCollectionPolicy: {type: string, enum: [ERROR, EXCLUDE, PRESERVE_PARENT]}
