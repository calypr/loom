      properties:
        name: {type: string, enum: [missingKeyPolicy, emptyCollectionPolicy]}
        options:
          type: array
          items: {type: string, minLength: 1}
    RowDefinitionProposalRequest:
      type: object
      additionalProperties: false
      required: [snapshotToken, expectedDraftVersion, expectedDraftDigest, outputId, selection]
      properties:
        snapshotToken: {type: string, minLength: 1}
        expectedDraftVersion: {type: integer, minimum: 1}
        expectedDraftDigest: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        limit: {type: integer, minimum: 1, maximum: 1000}
