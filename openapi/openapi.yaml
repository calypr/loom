            - {$ref: '#/components/schemas/RowDefinitionFieldGroupSelection'}
            - {$ref: '#/components/schemas/RowDefinitionExplicitGroupSelection'}
            - {$ref: '#/components/schemas/RowDefinitionExpandedSelection'}
