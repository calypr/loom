openapi: 3.0.3
info:
  title: Loom HTTP API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/projects/{project}/interpretation-libraries:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listInterpretationLibraries
      responses:
        '200':
          description: Project-scoped reusable interpretation libraries with exact immutable heads expanded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterpretationLibraryListResponse'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
    post:
      operationId: createInterpretationRevision
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InterpretationRevisionCreateRequest'}
      responses:
        '201':
          description: Newly created immutable interpretation revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterpretationRevision'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/interpretation-revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: revisionId
        in: path
        required: true
        schema: {type: string, minLength: 1}
    get:
      operationId: getInterpretationRevision
      responses:
        '200':
          description: Exact immutable interpretation revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterpretationRevision'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/selections:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: createExplorerSelection
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SelectionCreateRequest'}
      responses:
        '201':
          description: Complete immutable selection. Partial scans never return a usable revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SelectionRevision'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/selections/{selectionRevision}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
      - name: selectionRevision
        in: path
        required: true
        schema: {type: string, minLength: 1}
    get:
      operationId: getExplorerSelection
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        '200':
          description: Authorized header and bounded membership page under the original effective scope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SelectionPage'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/selections/{selectionRevision}/explicit-groups:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
      - name: selectionRevision
        in: path
        required: true
        schema: {type: string, minLength: 1}
    post:
      operationId: createExplorerExplicitGroupRevision
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExplicitGroupCreateRequest'}
      responses:
        '201':
          description: Complete immutable groups pinned to the exact source selection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExplicitGroupRevisionSummary'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/capability:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    get:
      operationId: getExplorerAuthoringCapability
      responses:
        '200':
          description: Supported authoring operations and UI features.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringCapability'
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/suggestions:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: searchExplorerCandidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateSearchRequest'
      responses:
        '200':
          description: Candidate definitions matching a node and query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateSearchResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/semantic-inventory:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: browseExplorerSemanticInventory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SemanticInventoryBrowseRequest'}
      responses:
        '200':
          description: Authorized observed bindings, not resolved column recipes. Occurrence counts describe source events, not row fill rates. Ordinary structural fields remain in the Builder capability catalog.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SemanticInventoryBrowseResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/construction-choices:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: searchExplorerConstructionChoices
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConstructionChoiceSearchRequest'}
      responses:
        '200':
          description: Compiler-proved construction routes for one exact field or semantic source identity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConstructionChoiceSearchResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/row-definition-choices:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    get:
      operationId: listExplorerRowDefinitionChoices
      parameters:
        - name: outputId
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: snapshotToken
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Schema-derived row choices for exact occurrences in the saved output route.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RowDefinitionChoicesResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/row-definition-proposals:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: proposeExplorerRowDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RowDefinitionProposalRequest'}
      responses:
        '200':
          description: A receipt-backed candidate with bounded before-and-after row comparison evidence when execution is available.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RowDefinitionProposal'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/table-shape-capabilities:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: getExplorerTableShapeCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TableShapeCapabilitiesRequest'}
      responses:
        '200':
          description: Server-derived column, reshape, operator, policy, and saved intent choices for the exact Explorer draft and compiler output.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TableShapeCapabilitiesResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/table-shape-category-discoveries:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: discoverExplorerTableShapeCategories
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TableShapeCategoryDiscoveryRequest'}
      responses:
        '200':
          description: A complete, catalog-bound list of server-discovered category values and safe output-name suggestions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TableShapeCategoryDiscoveryResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/table-shape-resolutions:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: resolveExplorerTableShape
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TableShapeResolutionRequest'}
      responses:
        '200':
          description: An immutable catalog-bound pivot, unpivot, or derived-column resolution with compiler-proved output type facts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TableShapeResolutionResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/table-shape-proposals:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: proposeExplorerTableShape
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TableShapeProposalRequest'}
      responses:
        '200':
          description: A nonmutating receipt-backed table-shape proposal with bounded before-and-after cell values and contributor evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TableShapeProposal'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/construction-capabilities:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: getExplorerConstructionCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConstructionCapabilitiesRequest'}
      responses:
        '200':
          description: Server-derived operation support and exact compiled stage schemas for the requested stable stage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConstructionCapabilitiesResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/construction-proposals:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: proposeExplorerConstruction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConstructionProposalRequest'}
      responses:
        '200':
          description: A typed staged-construction candidate, compiler-derived stages, dependency impact, and successful exact-output preview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConstructionProposalResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/population-routes:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: searchExplorerPopulationRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PopulationRoutesRequest'}
      responses:
        '200':
          description: Compiler-proved choices for connecting one immutable selected resource set to a table row root.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PopulationRoutesResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/column-source:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: getExplorerColumnSource
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ColumnSourceRequest'}
      responses:
        '200':
          description: Generic explanation and authorized route for one saved column, derived on read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColumnSourceResponse'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/builder:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    get:
      operationId: getExplorerBuilder
      responses:
        '200':
          description: Current workspace and its immutable catalog snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuilderState'
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/commands:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: applyExplorerBuilderCommands
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCommandsRequest'
      responses:
        '200':
          description: Canonical backend-authored workspace after an atomic command batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyCommandsResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/row-change:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: assessExplorerRowChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessRowChangeRequest'
      responses:
        '200':
          description: Read-only assessment of one row-root change against an exact draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowChangeAssessmentResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/reconcile:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: reconcileExplorerBuilder
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '200':
          description: Immutable receipt compiled from the exact persisted draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
