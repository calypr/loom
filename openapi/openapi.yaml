      properties:
        snapshotToken: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        choices:
          type: array
          items: {$ref: '#/components/schemas/RowDefinitionChoice'}
        explicitGroups:
          type: array
          items: {$ref: '#/components/schemas/ExplicitGroupRevisionChoice'}
    ExplicitGroupRevisionChoice:
      type: object
      additionalProperties: false
      required: [revisionId, groupCount, memberCount, createdAt, unassignedMemberPolicies]
      properties:
        revisionId: {type: string, minLength: 1}
        groupCount: {type: integer, minimum: 1}
        memberCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        unassignedMemberPolicies:
          type: array
          minItems: 1
          items: {type: string, enum: [ERROR, EXCLUDE, GROUP_AS_UNASSIGNED]}
    RowDefinitionChoice:
      type: object
      additionalProperties: false
      required: [choiceId, label, description, occurrenceSummary, routeSummary, kind, valueType, policies]
      properties:
        choiceId: {type: string, minLength: 1}
        label: {type: string}
        description: {type: string}
        occurrenceSummary: {type: string, minLength: 1}
        routeSummary: {type: string, minLength: 1}
        kind: {type: string, enum: [FIELD_GROUP, EXPANDED]}
        valueType: {type: string, enum: [STRING, NUMBER, BOOLEAN, ARRAY, OBJECT]}
        policies:
          type: array
          items: {$ref: '#/components/schemas/RowDefinitionChoicePolicy'}
    RowDefinitionChoicePolicy:
      type: object
      additionalProperties: false
