openapi: 3.0.3
info:
  title: Loom HTTP API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/projects/{project}/explorers/{explorerId}/selections:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: createExplorerSelection
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SelectionCreateRequest'}
      responses:
        '201':
          description: Complete immutable selection. Partial scans never return a usable revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SelectionRevision'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/selections/{selectionRevision}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
      - name: selectionRevision
        in: path
        required: true
        schema: {type: string, minLength: 1}
    get:
      operationId: getExplorerSelection
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        '200':
          description: Authorized header and bounded membership page under the original effective scope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SelectionPage'}
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/capability:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    get:
      operationId: getExplorerAuthoringCapability
      responses:
        '200':
          description: Supported authoring operations and UI features.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringCapability'
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/suggestions:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: searchExplorerCandidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateSearchRequest'
      responses:
        '200':
          description: Candidate definitions matching a node and query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateSearchResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/builder:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    get:
      operationId: getExplorerBuilder
      responses:
        '200':
          description: Current workspace and its immutable catalog snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuilderState'
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/commands:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: applyExplorerBuilderCommands
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCommandsRequest'
      responses:
        '200':
          description: Canonical backend-authored workspace after an atomic command batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyCommandsResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/row-change:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: assessExplorerRowChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessRowChangeRequest'
      responses:
        '200':
          description: Read-only assessment of one row-root change against an exact draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowChangeAssessmentResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/reconcile:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: reconcileExplorerBuilder
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '200':
          description: Immutable receipt compiled from the exact persisted draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/preview:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: previewExplorer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: Bounded preview of one receipt output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '413': {$ref: '#/components/responses/AuthoringPayloadTooLarge'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '429': {$ref: '#/components/responses/AuthoringTooManyRequests'}
        '499': {$ref: '#/components/responses/AuthoringClientClosedRequest'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
        '504': {$ref: '#/components/responses/AuthoringGatewayTimeout'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/population-mapping:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: checkExplorerPopulationMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PopulationMappingRequest'
      responses:
        '200':
          description: Receipt-bound selected-resource coverage report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopulationMappingResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
        '504': {$ref: '#/components/responses/AuthoringGatewayTimeout'}
  /api/v1/projects/{project}/explorers/{explorerId}/authoring/v2/publish:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    post:
      operationId: publishExplorer
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Activated Explorer revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '400': {$ref: '#/components/responses/AuthoringBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/AuthoringForbidden'}
        '404': {$ref: '#/components/responses/AuthoringNotFound'}
        '409': {$ref: '#/components/responses/AuthoringConflict'}
        '422': {$ref: '#/components/responses/AuthoringUnprocessable'}
        '500': {$ref: '#/components/responses/AuthoringInternalError'}
        '503': {$ref: '#/components/responses/AuthoringUnavailable'}
  /health:
    get:
      operationId: getHealth
      summary: Report cached core and dataframe health.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '503':
          description: A required health dependency is not ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
  /livez:
    get:
      operationId: getLiveness
      summary: Report process liveness without checking dependencies.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether required dependencies are ready.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '503':
          description: Dependencies are not ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
  /api/v1/datasets/{project}/generations/{generation}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Generation'
    get:
      operationId: getDatasetGenerationStatus
      summary: Read a dataset generation's persisted load state.
      description: This preflight uses write authorization because it determines whether a subsequent generation upload may proceed.
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      responses:
        '200':
          description: The persisted generation state and whether it can be reused.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationStatusResponse'}
        '400': {$ref: '#/components/responses/ServiceBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/ServiceForbidden'}
        '404': {$ref: '#/components/responses/ServiceNotFound'}
        '500': {$ref: '#/components/responses/ServiceInternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: createDatasetGeneration
      summary: Upload a multipart dataset generation.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, project, generation]
              properties:
                file:
                  type: array
                  items: {type: string, format: binary}
                project: {type: string}
                generation: {type: string}
                auth_resource_path: {type: string}
                defer_activation: {type: boolean}
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '400': {$ref: '#/components/responses/ServiceBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/ServiceForbidden'}
        '409': {$ref: '#/components/responses/ServiceConflict'}
        '415': {$ref: '#/components/responses/ServiceUnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ServiceUnprocessable'}
        '500': {$ref: '#/components/responses/ServiceInternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/datasets/{project}/generations/{generation}/activate:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Generation'
      - name: dataframe_execution_id
        in: query
        required: true
        schema: {type: string}
      - name: auth_resource_path
        in: query
        schema: {type: string}
    post:
      operationId: activateDatasetGeneration
      summary: Activate a generation after dataframe publication.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationActivationResponse'}
        '400': {$ref: '#/components/responses/ServiceBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/ServiceForbidden'}
        '409': {$ref: '#/components/responses/ServiceConflict'}
        '500': {$ref: '#/components/responses/ServiceInternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/dataframe/recipe-executions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getRecipeExecution
      summary: Read public metadata for a dataframe recipe execution.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecipeExecutionResponse'}
        '401':
          description: Authentication is missing, invalid, or cannot be resolved for the execution's dataset scope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '403': {$ref: '#/components/responses/LegacyForbidden'}
        '404': {$ref: '#/components/responses/LegacyNotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /graphql/graph:
    get:
      operationId: getGraphQLPlayground
      summary: Render the GraphQL playground.
      responses:
        '200': {$ref: '#/components/responses/HTML'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '404': {$ref: '#/components/responses/ServiceNotFound'}
    post:
      operationId: executeGraphQL
      summary: Execute a graph or FHIR GraphQL operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RawJSON'}
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '400': {$ref: '#/components/responses/GraphQLBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '409':
          description: The GraphQL operation used stale cursor, revision, or publication identity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '422': {$ref: '#/components/responses/GraphQLUnprocessable'}
        '500': {$ref: '#/components/responses/GraphQLInternalError'}
  /graphql/dataframe:
    post:
      operationId: executeDataframeGraphQL
      summary: Execute a dataframe GraphQL operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RawJSON'}
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '400': {$ref: '#/components/responses/GraphQLBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '409':
          description: The GraphQL operation used stale cursor, revision, or publication identity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '422': {$ref: '#/components/responses/GraphQLUnprocessable'}
        '500': {$ref: '#/components/responses/GraphQLInternalError'}
  /apollo:
    get:
      operationId: getApolloSandbox
      summary: Render the Apollo GraphQL sandbox.
      responses:
        '200': {$ref: '#/components/responses/HTML'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '404': {$ref: '#/components/responses/ServiceNotFound'}
  /api/v1/projects/{project}/explorers:
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listExplorers
      summary: List Explorer summaries for a project.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/LegacyForbidden'}
        '500': {$ref: '#/components/responses/LegacyInternalError'}
    post:
      operationId: createExplorer
      summary: Create an interactive Explorer.
      parameters:
        - $ref: '#/components/parameters/AuthResourcePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RawJSON'}
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/LegacyForbidden'}
        '409': {$ref: '#/components/responses/LegacyConflict'}
        '422': {$ref: '#/components/responses/LegacyUnprocessable'}
        '500': {$ref: '#/components/responses/LegacyInternalError'}
  /api/v1/projects/{project}/explorers/{explorerId}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/ExplorerId'
    get:
      operationId: getExplorer
      summary: Read an Explorer's active runtime projection.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/LegacyForbidden'}
        '404': {$ref: '#/components/responses/LegacyNotFound'}
        '500': {$ref: '#/components/responses/LegacyInternalError'}
  /api/v1/projects/{project}/generations/{generation}/explorer-config:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Generation'
    post:
      operationId: publishRepositoryExplorerConfig
      summary: Compile and publish a repository-owned Explorer workspace.
      parameters:
        - name: auth_resource_path
          in: query
          schema: {type: string}
        - name: X-Loom-Source-Commit
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Workspace'}
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RawJSON'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/ServiceUnauthorized'}
        '403': {$ref: '#/components/responses/LegacyForbidden'}
        '409': {$ref: '#/components/responses/LegacyConflict'}
        '422': {$ref: '#/components/responses/LegacyUnprocessable'}
        '500': {$ref: '#/components/responses/LegacyInternalError'}
        '503': {$ref: '#/components/responses/LegacyUnavailable'}
components:
  parameters:
    Project:
      name: project
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ExplorerId:
      name: explorerId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AuthResourcePath:
      name: auth_resource_path
      in: query
      required: false
      description: Optional Calypr resource scope used to authorize durable Explorer mutations.
      schema: {type: string}
    Generation:
      name: generation
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    AuthoringBadRequest:
      description: The JSON document is malformed, contains unknown fields, or omits required authoring input.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringForbidden:
      description: The authenticated principal cannot read or modify this Explorer project.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringNotFound:
      description: The Explorer, candidate, compilation receipt, or other operation-specific authoring resource does not exist.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringConflict:
      description: Immutable capability or receipt state is stale, or optimistic draft/publication state changed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringPayloadTooLarge:
      description: The bounded preview result exceeds the maximum response size.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringUnprocessable:
      description: The request is valid JSON but its workspace, command, output, or compilation intent is semantically invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringTooManyRequests:
      description: The requested preview plan exceeds the server's execution-cost policy.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringClientClosedRequest:
      description: The client canceled preview execution before completion.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringInternalError:
      description: An unexpected authoring, persistence, or preview failure occurred.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringUnavailable:
      description: A required capability, receipt store, materializer, activation service, or backend is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringGatewayTimeout:
      description: Preview execution exceeded its server-side deadline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceBadRequest:
      description: A required path, query, multipart, JSON, or NDJSON value is missing or invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceUnauthorized:
      description: Authentication credentials are absent or invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceForbidden:
      description: The authenticated principal lacks access to the requested project or resource scope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceNotFound:
      description: The requested dataset, generation, release, recipe execution, or route resource was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceConflict:
      description: Immutable content, activation state, cursor state, or publication state conflicts with the request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServicePayloadTooLarge:
      description: The request or generated response exceeds the configured size limit.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceUnprocessable:
      description: The request is syntactically valid but its data, generation, or release requirements cannot be processed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceUnsupportedMediaType:
      description: Content-Type is not supported by this upload operation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceInternalError:
      description: An unexpected server error occurred; details are redacted and correlated by requestId.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceUnavailable:
      description: A required authorization, storage, ingestion, publication, or query backend is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    GraphQLBadRequest:
      description: The GraphQL HTTP request envelope or transport parameters are malformed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RawJSON'}
    GraphQLUnprocessable:
      description: The GraphQL document could not be parsed or validated for execution.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RawJSON'}
    GraphQLInternalError:
      description: GraphQL execution failed before a normal GraphQL response could be produced.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RawJSON'}
    LegacyBadRequest:
      description: The legacy Explorer request is malformed or missing required input.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyUnauthorized:
      description: Authentication credentials are absent or invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    LegacyForbidden:
      description: The authenticated principal cannot access this Explorer project.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyNotFound:
      description: The Explorer or repository-owned Explorer configuration was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyConflict:
      description: The Explorer already exists or repository deployment state changed or is inconsistent.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyUnprocessable:
      description: The Explorer workspace or deployment is syntactically valid but cannot be compiled, materialized, or published.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyInternalError:
      description: Reading or persisting the Explorer failed unexpectedly.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyUnavailable:
      description: Repository compilation, materialization, or release activation is not configured or unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    HTML:
      description: Existing browser UI document.
      content:
        text/html:
          schema: {type: string}
  schemas:
    SelectionResourceRef:
      type: object
      additionalProperties: false
      required: [project, generation, resourceType, id]
      properties:
        project: {type: string, minLength: 1}
        generation: {type: string, minLength: 1}
        resourceType: {type: string, minLength: 1}
        id: {type: string, minLength: 1}
    SelectionFilter:
      type: object
      additionalProperties: false
      required: [column, op]
      properties:
        column: {type: string, minLength: 1}
        op: {type: string, minLength: 1}
        value: {}
    SelectionExplicitResources:
      type: object
      additionalProperties: false
      required: [refs]
      properties:
        resourceType:
          type: string
          minLength: 1
          description: Required for empty refs; otherwise must match every reference.
        refs:
          type: array
          items: {$ref: '#/components/schemas/SelectionResourceRef'}
    SelectionPublishedOutput:
      type: object
      additionalProperties: false
      required: [revisionId, outputId]
      properties:
        revisionId: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        filters:
          type: array
          items: {$ref: '#/components/schemas/SelectionFilter'}
    SelectionBaseRevision:
      type: object
      additionalProperties: false
      required: [selectionRevisionId]
      properties:
        selectionRevisionId: {type: string, minLength: 1}
    SelectionRequestSource:
      type: object
      additionalProperties: false
      required: [kind]
      description: Exactly one payload matching kind is required. Published identities are resolved by the server.
      properties:
        kind: {type: string, enum: [resources, publishedOutput, selectionRevision]}
        resources: {$ref: '#/components/schemas/SelectionExplicitResources'}
        publishedOutput: {$ref: '#/components/schemas/SelectionPublishedOutput'}
        selectionRevision: {$ref: '#/components/schemas/SelectionBaseRevision'}
    SelectionCreateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, snapshotToken, source]
      properties:
        idempotencyKey: {type: string, minLength: 1}
        snapshotToken: {type: string, minLength: 1}
        source: {$ref: '#/components/schemas/SelectionRequestSource'}
        exclusions:
          type: array
          items: {$ref: '#/components/schemas/SelectionResourceRef'}
    SelectionRule:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [EXPLICIT, ALL_MATCHING]}
        filters:
          type: array
          items: {$ref: '#/components/schemas/SelectionFilter'}
    SelectionSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [EXPLICIT_REFS, PUBLISHED_OUTPUT, SELECTION_REVISION]}
        generation: {type: string}
        revisionId: {type: string}
        receiptId: {type: string}
        executionId: {type: string}
        outputId: {type: string}
        schemaDigest: {type: string}
        resourceType: {type: string}
        sourceIdColumn: {type: string}
        membershipDigest: {type: string}
    SelectionRevision:
      type: object
      additionalProperties: false
      required: [id, project, generation, resourceType, rule, source, scopeDigest, ruleDigest, membershipDigest, memberCount, memberBytes, complete, createdAt]
      properties:
        id: {type: string}
        project: {type: string}
        generation: {type: string}
        resourceType: {type: string}
        rule: {$ref: '#/components/schemas/SelectionRule'}
        source: {$ref: '#/components/schemas/SelectionSource'}
        exclusions:
          type: array
          items: {$ref: '#/components/schemas/SelectionResourceRef'}
        scopeDigest: {type: string}
        ruleDigest: {type: string}
        membershipDigest: {type: string}
        memberCount: {type: integer, format: int64, minimum: 0}
        memberBytes: {type: integer, format: int64, minimum: 0}
        complete: {type: boolean}
        idempotencyKey: {type: string}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    SelectionMember:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: {$ref: '#/components/schemas/SelectionResourceRef'}
        ordinal: {type: integer, format: int64}
        memberKey: {type: string}
    SelectionPage:
      type: object
      additionalProperties: false
      required: [revision, members]
      properties:
        revision: {$ref: '#/components/schemas/SelectionRevision'}
        members:
          type: array
          items: {$ref: '#/components/schemas/SelectionMember'}
        nextCursor: {type: string}
    RawJSON:
      description: JSON whose existing shape is preserved losslessly during route cutover.
      type: object
      additionalProperties: true
    GenerationStatusResponse:
      type: object
      additionalProperties: false
      required: [project, generation, state, reusable]
      properties:
        project: {type: string}
        generation: {type: string}
        state: {type: string}
        reusable: {type: boolean}
    GenerationActivationResponse:
      type: object
      additionalProperties: false
      required: [project, generation, dataframeExecutionId, activated]
      properties:
        project: {type: string}
        generation: {type: string}
        dataframeExecutionId: {type: string}
        activated: {type: boolean}
    RecipeExecutionResponse:
      type: object
      additionalProperties: false
      required: [id, projectId, datasetGeneration, recipeDigest, schemaDigest, resolvedSchemaDigest, state, outputs]
      properties:
        id: {type: string}
        projectId: {type: string}
        datasetGeneration: {type: string}
        recipeDigest: {type: string}
        schemaDigest: {type: string}
        resolvedSchemaDigest: {type: string}
        state: {type: string}
        outputs:
          type: array
          items: {$ref: '#/components/schemas/RecipeExecutionOutput'}
    RecipeExecutionOutput:
      type: object
      additionalProperties: false
      required: [name, state, rowCount, columns]
      properties:
        name: {type: string}
        state: {type: string}
        rowCount: {type: integer, format: int64}
        columns:
          type: array
          items: {$ref: '#/components/schemas/RecipeExecutionColumn'}
    RecipeExecutionColumn:
      type: object
      additionalProperties: false
      required: [name, semanticPath, clickhouseType, logicalType, nullable, repeated, filterable, sortable, aggregatable]
      properties:
        name: {type: string}
        semanticPath: {type: string}
        clickhouseType: {type: string}
        logicalType: {type: string}
        nullable: {type: boolean}
        repeated: {type: boolean}
        filterable: {type: boolean}
        sortable: {type: boolean}
        aggregatable: {type: boolean}
    ServiceErrorResponse:
      description: Stable error envelope emitted by Loom's shared HTTP error mapper and snapshot routes.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ServiceErrorBody'
    ServiceErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        fieldPath:
          type: array
          items: {type: string}
        details:
          type: object
          nullable: true
          additionalProperties: true
        retryable: {type: boolean}
        requestId: {type: string}
    LegacyErrorResponse:
      description: Error envelope retained by legacy Explorer and recipe-execution routes.
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error:
          description: Either a legacy message string or a structured code/message object, depending on the route.
          oneOf:
            - {type: string}
            - $ref: '#/components/schemas/LegacyErrorBody'
    LegacyErrorBody:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    AuthoringCapability:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, operations, previewLimits, features]
      properties:
        apiVersion: {$ref: '#/components/schemas/APIVersion'}
        kind: {type: string, enum: [ExplorerAuthoringCapabilities]}
        operations:
          type: array
          items: {type: string, enum: [builder, suggestions, rowChange, preview, publish, commands, reconcile]}
        previewLimits:
          type: array
          items: {type: integer, minimum: 1, maximum: 1000}
        features:
          $ref: '#/components/schemas/AuthoringFeatures'
    AuthoringFeatures:
      type: object
      additionalProperties: false
      required: [emissionFilters, emissionCharts, sharedFilters, fixedFilters, fileActions, deleteExplorer]
      properties:
        emissionFilters: {type: boolean}
        emissionCharts: {type: boolean}
        sharedFilters: {type: boolean}
        fixedFilters: {type: boolean}
        fileActions: {type: boolean}
        deleteExplorer: {type: boolean}
    APIVersion:
      type: string
      enum: [loom.calypr.org/explorer-authoring/v2]
    ProjectionMode:
      type: string
      enum: [SCALAR, INDEXED, FIRST, ARRAY, DISTINCT_ARRAY, VALUE, ALL, DISTINCT]
    Workspace:
      type: object
      x-go-type: authoringv2.Workspace
      x-go-type-import:
        path: github.com/calypr/loom/internal/explorer/authoringv2
        name: authoringv2
      additionalProperties: false
      required: [apiVersion, kind, explorer, documents, tabs]
      properties:
        apiVersion: {$ref: '#/components/schemas/APIVersion'}
        kind: {type: string, enum: [ExplorerBuilderWorkspace]}
        semanticsVersion: {type: integer, minimum: 1}
        explorer: {$ref: '#/components/schemas/ExplorerMetadata'}
        documents:
          type: array
          items: {$ref: '#/components/schemas/Document'}
        tabs:
          type: array
          items: {$ref: '#/components/schemas/Tab'}
        sharedFilters:
          type: object
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/SharedFilterBinding'}
        fileActions: {$ref: '#/components/schemas/FileActions'}
    ExplorerMetadata:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
    Tab:
      type: object
      additionalProperties: false
      required: [id, title, outputId, order, visible]
      properties:
        id: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
        title: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        order: {type: integer, minimum: 0}
        visible: {type: boolean}
    Document:
      type: object
      additionalProperties: false
      required: [kind, output, rootResourceType, route, columns]
      properties:
        kind: {type: string, enum: [ExplorerBuilderDocument]}
        output: {$ref: '#/components/schemas/Output'}
        rootResourceType: {type: string, minLength: 1}
        route: {$ref: '#/components/schemas/RouteNode'}
        population: {$ref: '#/components/schemas/Population'}
        columns:
          type: array
          items: {$ref: '#/components/schemas/Column'}
        fixedFilters:
          type: array
          items: {$ref: '#/components/schemas/FixedFilter'}
        actions:
          type: array
          items: {$ref: '#/components/schemas/Action'}
    Population:
      type: object
      additionalProperties: false
      required: [selectionRevisionId, route]
      properties:
        selectionRevisionId: {type: string, minLength: 1}
        route:
          type: array
          items: {$ref: '#/components/schemas/PopulationRouteStep'}
    PopulationRouteStep:
      type: object
      additionalProperties: false
      required: [resourceType, relationship]
      properties:
        resourceType: {type: string, minLength: 1}
        relationship: {type: string, minLength: 1}
    Output:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        rowLabel: {type: string}
    RouteNode:
      type: object
      additionalProperties: false
      required: [occurrenceId, resourceType]
      properties:
        occurrenceId: {type: string, minLength: 1}
        resourceType: {type: string, minLength: 1}
        relationship: {type: string}
        matchMode: {type: string, enum: [OPTIONAL, REQUIRED]}
        children:
          type: array
          items: {$ref: '#/components/schemas/RouteNode'}
    ColumnSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [field, aggregate, identifierBySystem, extensionByUrl, codingBySystem, observationComponentByCode, projectId]
        field: {$ref: '#/components/schemas/FieldSource'}
        aggregate: {$ref: '#/components/schemas/AggregateSource'}
        lookup: {$ref: '#/components/schemas/LookupSource'}
    FieldSource:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: {type: string, minLength: 1}
        projectionMode: {type: string, enum: [VALUE, INDEXED, FIRST, ALL, DISTINCT]}
        relatedSelection: {$ref: '#/components/schemas/RelatedSelection'}
    AggregateSource:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation: {type: string, enum: [COUNT, COUNT_DISTINCT, DISTINCT_VALUES, MIN, MAX, EXISTS, CONTAINS_ALL, REQUIRE_ONE, COLLECT, FIRST_ORDERED]}
        path: {type: string}
        requiredValues:
          type: array
          items: {type: string}
        temporal: {$ref: '#/components/schemas/TemporalReductionSource'}
    TemporalReductionSource:
      type: object
      additionalProperties: false
      required: [timestampPath, anchorPath, lowerOffsetSeconds, upperOffsetSeconds, lowerInclusive, upperInclusive, direction, precision, tiePolicy]
      properties:
        timestampPath: {type: string, minLength: 1}
        anchorPath: {type: string, minLength: 1}
        lowerOffsetSeconds: {type: integer, format: int64}
        upperOffsetSeconds: {type: integer, format: int64}
        lowerInclusive: {type: boolean}
        upperInclusive: {type: boolean}
        direction: {type: string, enum: [ASC, DESC]}
        precision: {type: string, enum: [INSTANT]}
        tiePolicy: {type: string, enum: [REQUIRE_UNIQUE, RESOURCE_KEY]}
    ContributorPredicate:
      type: object
      additionalProperties: false
      required: [candidateId, operator]
      properties:
        candidateId: {type: string, minLength: 1}
        operator: {type: string, enum: [EXISTS, EQUALS]}
        quantifier: {type: string, enum: [ANY]}
        value: {$ref: '#/components/schemas/ContributorValue'}
    ContributorValue:
      oneOf:
        - $ref: '#/components/schemas/ContributorStringValue'
        - $ref: '#/components/schemas/ContributorCodeValue'
    ContributorStringValue:
      type: object
      additionalProperties: false
      required: [kind, string]
      properties:
        kind: {type: string, enum: [STRING]}
        string: {type: string}
    ContributorCodeValue:
      type: object
      additionalProperties: false
      required: [kind, code]
      properties:
        kind: {type: string, enum: [CODE]}
        code:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: {type: string, minLength: 1}
    LookupSource:
      type: object
      additionalProperties: false
      description: Exactly one legacy match/path, correlated binding/key, or ancestor-aware extension payload is required. Legacy payloads remain readable; new concept lookup commands require typed bindings.
      properties:
        match: {type: string, minLength: 1}
        path: {type: string}
        projectionMode: {type: string, enum: [VALUE, INDEXED, FIRST, ALL, DISTINCT]}
        binding: {$ref: '#/components/schemas/CorrelatedBinding'}
        key: {$ref: '#/components/schemas/TerminologyKey'}
        extension: {$ref: '#/components/schemas/ExtensionBinding'}
    ExtensionBinding:
      type: object
      additionalProperties: false
      required: [ownerPath, urlPath, valuePath, logicalType]
      properties:
        ownerPath: {type: string, minLength: 1}
        urlPath:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        valuePath: {type: string, minLength: 1}
        valueFallback:
          type: array
          items: {type: string, minLength: 1}
        choiceArms:
          type: array
          items: {type: string, minLength: 1}
        logicalType: {type: string, minLength: 1}
        unitPath: {type: string}
    TerminologyKey:
      type: object
      additionalProperties: false
      required: [system, code]
      properties:
        system: {type: string, minLength: 1}
        code: {type: string, minLength: 1}
    CorrelatedBinding:
      type: object
      additionalProperties: false
      required: [keyPath, systemPath, codePath, valuePath, logicalType]
      properties:
        ownerPath: {type: string}
        keyPath: {type: string, minLength: 1}
        systemPath: {type: string, minLength: 1}
        codePath: {type: string, minLength: 1}
        valuePath: {type: string, minLength: 1}
        valueFallback:
          type: array
          items: {type: string, minLength: 1}
        choiceArms:
          type: array
          items: {type: string, minLength: 1}
        logicalType: {type: string, minLength: 1}
        unitPath: {type: string}
    RelatedSelection:
      type: object
      additionalProperties: false
      required: [kind, acknowledged]
      properties:
        kind: {type: string, enum: [first-by-resource-key]}
        acknowledged: {type: boolean}
    Column:
      type: object
      additionalProperties: false
      required: [column, label, occurrenceId, source]
      properties:
        column: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
        label: {type: string, minLength: 1}
        logicalType: {type: string}
        occurrenceId: {type: string, minLength: 1}
        source: {$ref: '#/components/schemas/ColumnSource'}
        contributor: {$ref: '#/components/schemas/ContributorPredicate'}
        table: {$ref: '#/components/schemas/TablePresentation'}
        filter: {$ref: '#/components/schemas/FilterPresentation'}
        chart: {$ref: '#/components/schemas/ChartPresentation'}
    FixedFilter:
      type: object
      additionalProperties: false
      required: [column, values]
      properties:
        column: {type: string, minLength: 1}
        values:
          type: array
          minItems: 1
          items: {type: string}
    ActionColumn:
      type: object
      additionalProperties: false
      required: [column]
      properties:
        column: {type: string, minLength: 1}
        exportHeader: {type: string}
    Action:
      type: object
      additionalProperties: false
      required: [type, title]
      properties:
        type: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        fileName: {type: string}
        columns:
          type: array
          items: {$ref: '#/components/schemas/ActionColumn'}
    SharedFilterBinding:
      type: object
      additionalProperties: false
      required: [outputId, column]
      properties:
        outputId: {type: string, minLength: 1}
        column: {type: string, minLength: 1}
    FileActions:
      type: object
      additionalProperties: false
      required: [extensions, actions]
      properties:
        extensions:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        actions:
          type: object
          additionalProperties: {type: string}
    TablePresentation:
      type: object
      additionalProperties: false
      properties:
        visible: {type: boolean}
        order: {type: integer, minimum: 0}
        pinned: {type: boolean}
        cellRenderer: {type: string, enum: [fileActions]}
    FilterPresentation:
      type: object
      additionalProperties: false
      properties:
        label: {type: string}
        order: {type: integer, minimum: 0}
    ChartPresentation:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, minLength: 1}
        title: {type: string}
        order: {type: integer, minimum: 0}
    ApplyCommandsRequest:
      type: object
      additionalProperties: false
      required: [commandId, semanticsVersion, snapshotToken, expectedDraftVersion, commands]
      properties:
        commandId: {type: string, minLength: 1}
        semanticsVersion: {type: integer, minimum: 1}
        snapshotToken: {type: string, minLength: 1}
        expectedDraftVersion: {type: integer, format: int64, minimum: 0}
        expectedDraftDigest: {type: string}
        commands:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AuthoringCommand'}
    AuthoringCommand:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [CREATE_TABLE, DUPLICATE_TABLE, DELETE_TABLE, RENAME_TABLE, REORDER_TABLES, SET_TABLE_ROOT, APPLY_TABLE_ROOT_REBASE, SET_TABLE_POPULATION, CLEAR_TABLE_POPULATION, ADD_ROUTE, UPDATE_ROUTE_EDGE, SET_ROUTE_MATCH_MODE, REMOVE_ROUTE, ADD_COLUMN, ADD_COLUMN_SOURCE, UPDATE_COLUMN, SET_COLUMN_CONTRIBUTOR, CLEAR_COLUMN_CONTRIBUTOR, UPDATE_COLUMN_SOURCE, REMOVE_COLUMN]
        outputId: {type: string, minLength: 1}
        sourceOutputId: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        rootNodeId: {type: string, minLength: 1}
        selectionRevisionId: {type: string, minLength: 1}
        edgeIds:
          type: array
          items: {type: string, minLength: 1}
        parentOccurrenceId: {type: string, minLength: 1}
        occurrenceId: {type: string, minLength: 1}
        edgeId: {type: string, minLength: 1}
        matchMode: {type: string, enum: [OPTIONAL, REQUIRED]}
        candidateId: {type: string, minLength: 1}
        projectionMode: {$ref: '#/components/schemas/ProjectionMode'}
        initialPresentation: {type: string, enum: [TABLE, FILTER, CHART]}
        column: {type: string, minLength: 1}
        columnValue: {$ref: '#/components/schemas/Column'}
        contributor: {$ref: '#/components/schemas/ContributorPredicate'}
        source: {$ref: '#/components/schemas/ColumnSource'}
        rowChange: {$ref: '#/components/schemas/RowChangeProposal'}
        outputIds:
          type: array
          items: {type: string, minLength: 1}
    RouteRebaseChoice:
      type: object
      additionalProperties: false
      required: [occurrenceId, edgeId]
      properties:
        occurrenceId: {type: string, minLength: 1}
        edgeId: {type: string, minLength: 1}
    RowChangeProposal:
