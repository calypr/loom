        '409': {$ref: '#/components/responses/LegacyConflict'}
        '422': {$ref: '#/components/responses/LegacyUnprocessable'}
        '500': {$ref: '#/components/responses/LegacyInternalError'}
        '503': {$ref: '#/components/responses/LegacyUnavailable'}
components:
  parameters:
    Project:
      name: project
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ExplorerId:
      name: explorerId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AuthResourcePath:
      name: auth_resource_path
      in: query
      required: false
      description: Optional Calypr resource scope used to authorize durable Explorer mutations.
      schema: {type: string}
    Generation:
      name: generation
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    AuthoringBadRequest:
      description: The JSON document is malformed, contains unknown fields, or omits required authoring input.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringForbidden:
      description: The authenticated principal cannot read or modify this Explorer project.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringNotFound:
      description: The Explorer, candidate, compilation receipt, or other operation-specific authoring resource does not exist.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringConflict:
      description: Immutable capability or receipt state is stale, or optimistic draft/publication state changed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringPayloadTooLarge:
      description: The bounded preview result exceeds the maximum response size.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringUnprocessable:
      description: The request is valid JSON but its workspace, command, output, or compilation intent is semantically invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringTooManyRequests:
      description: The requested preview plan exceeds the server's execution-cost policy.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringClientClosedRequest:
      description: The client canceled preview execution before completion.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringInternalError:
      description: An unexpected authoring, persistence, or preview failure occurred.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringUnavailable:
      description: A required capability, receipt store, materializer, activation service, or backend is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthoringGatewayTimeout:
      description: Preview execution exceeded its server-side deadline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceBadRequest:
      description: A required path, query, multipart, JSON, or NDJSON value is missing or invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceUnauthorized:
      description: Authentication credentials are absent or invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceForbidden:
      description: The authenticated principal lacks access to the requested project or resource scope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceNotFound:
      description: The requested dataset, generation, release, recipe execution, or route resource was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceConflict:
      description: Immutable content, activation state, cursor state, or publication state conflicts with the request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServicePayloadTooLarge:
      description: The request or generated response exceeds the configured size limit.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceUnprocessable:
      description: The request is syntactically valid but its data, generation, or release requirements cannot be processed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceUnsupportedMediaType:
      description: Content-Type is not supported by this upload operation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceInternalError:
      description: An unexpected server error occurred; details are redacted and correlated by requestId.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    ServiceUnavailable:
      description: A required authorization, storage, ingestion, publication, or query backend is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    GraphQLBadRequest:
      description: The GraphQL HTTP request envelope or transport parameters are malformed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RawJSON'}
    GraphQLUnprocessable:
      description: The GraphQL document could not be parsed or validated for execution.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RawJSON'}
    GraphQLInternalError:
      description: GraphQL execution failed before a normal GraphQL response could be produced.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RawJSON'}
    LegacyBadRequest:
      description: The legacy Explorer request is malformed or missing required input.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyUnauthorized:
      description: Authentication credentials are absent or invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceErrorResponse'}
    LegacyForbidden:
      description: The authenticated principal cannot access this Explorer project.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyNotFound:
      description: The Explorer or repository-owned Explorer configuration was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyConflict:
      description: The Explorer already exists or repository deployment state changed or is inconsistent.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyUnprocessable:
      description: The Explorer workspace or deployment is syntactically valid but cannot be compiled, materialized, or published.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyInternalError:
      description: Reading or persisting the Explorer failed unexpectedly.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    LegacyUnavailable:
      description: Repository compilation, materialization, or release activation is not configured or unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
    HTML:
      description: Existing browser UI document.
      content:
        text/html:
          schema: {type: string}
  schemas:
    SelectionResourceRef:
      type: object
      additionalProperties: false
      required: [project, generation, resourceType, id]
      properties:
        project: {type: string, minLength: 1}
        generation: {type: string, minLength: 1}
        resourceType: {type: string, minLength: 1}
        id: {type: string, minLength: 1}
    SelectionFilter:
      type: object
      additionalProperties: false
      required: [column, op]
      properties:
        column: {type: string, minLength: 1}
        op: {type: string, minLength: 1}
        value: {}
    SelectionExplicitResources:
      type: object
      additionalProperties: false
      required: [refs]
      properties:
        resourceType:
          type: string
          minLength: 1
          description: Required for empty refs; otherwise must match every reference.
        refs:
          type: array
          items: {$ref: '#/components/schemas/SelectionResourceRef'}
    SelectionPublishedOutput:
      type: object
      additionalProperties: false
      required: [revisionId, outputId]
      properties:
        revisionId: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        filters:
          type: array
          items: {$ref: '#/components/schemas/SelectionFilter'}
    SelectionBaseRevision:
      type: object
      additionalProperties: false
      required: [selectionRevisionId]
      properties:
        selectionRevisionId: {type: string, minLength: 1}
    SelectionRequestSource:
      type: object
      additionalProperties: false
      required: [kind]
      description: Exactly one payload matching kind is required. Published identities are resolved by the server.
      properties:
        kind: {type: string, enum: [resources, publishedOutput, selectionRevision]}
        resources: {$ref: '#/components/schemas/SelectionExplicitResources'}
        publishedOutput: {$ref: '#/components/schemas/SelectionPublishedOutput'}
        selectionRevision: {$ref: '#/components/schemas/SelectionBaseRevision'}
    SelectionCreateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, snapshotToken, source]
      properties:
        idempotencyKey: {type: string, minLength: 1}
        snapshotToken: {type: string, minLength: 1}
        source: {$ref: '#/components/schemas/SelectionRequestSource'}
        exclusions:
          type: array
          items: {$ref: '#/components/schemas/SelectionResourceRef'}
    SelectionRule:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [EXPLICIT, ALL_MATCHING]}
        filters:
          type: array
          items: {$ref: '#/components/schemas/SelectionFilter'}
    SelectionSource:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [EXPLICIT_REFS, PUBLISHED_OUTPUT, SELECTION_REVISION]}
        generation: {type: string}
        revisionId: {type: string}
        receiptId: {type: string}
        executionId: {type: string}
        outputId: {type: string}
        schemaDigest: {type: string}
        resourceType: {type: string}
        sourceIdColumn: {type: string}
        membershipDigest: {type: string}
    SelectionRevision:
      type: object
      additionalProperties: false
      required: [id, project, generation, resourceType, rule, source, scopeDigest, ruleDigest, membershipDigest, memberCount, memberBytes, complete, createdAt]
      properties:
        id: {type: string}
        project: {type: string}
        generation: {type: string}
        resourceType: {type: string}
        rule: {$ref: '#/components/schemas/SelectionRule'}
        source: {$ref: '#/components/schemas/SelectionSource'}
        exclusions:
          type: array
          items: {$ref: '#/components/schemas/SelectionResourceRef'}
        scopeDigest: {type: string}
        ruleDigest: {type: string}
        membershipDigest: {type: string}
        memberCount: {type: integer, format: int64, minimum: 0}
        memberBytes: {type: integer, format: int64, minimum: 0}
        complete: {type: boolean}
        idempotencyKey: {type: string}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    SelectionMember:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: {$ref: '#/components/schemas/SelectionResourceRef'}
        ordinal: {type: integer, format: int64}
        memberKey: {type: string}
    SelectionPage:
      type: object
      additionalProperties: false
      required: [revision, members]
      properties:
        revision: {$ref: '#/components/schemas/SelectionRevision'}
        members:
          type: array
          items: {$ref: '#/components/schemas/SelectionMember'}
        nextCursor: {type: string}
    ExplicitGroupCreateRequest:
      type: object
      additionalProperties: false
      required: [snapshotToken, idempotencyKey, groups]
      properties:
        snapshotToken: {type: string, minLength: 1}
        idempotencyKey: {type: string, minLength: 1, maxLength: 256}
        groups:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/ExplicitGroupInput'}
    ExplicitGroupInput:
      type: object
      additionalProperties: false
      required: [id, label, ordinal, memberIds]
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        label: {type: string, minLength: 1, maxLength: 256}
        ordinal: {type: integer, format: int64, minimum: 0}
        memberIds:
          type: array
          maxItems: 100000
          uniqueItems: true
          description: Opaque member keys returned by the exact source selection.
          items: {type: string, minLength: 1, maxLength: 512}
    ExplicitGroupRevisionSummary:
      type: object
      additionalProperties: false
      required: [revisionId, sourceSelectionRevisionId, groupCount, memberCount, createdAt, groups]
      properties:
        revisionId: {type: string, minLength: 1}
        sourceSelectionRevisionId: {type: string, minLength: 1}
        groupCount: {type: integer, format: int64, minimum: 1}
        memberCount: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        groups:
          type: array
          items: {$ref: '#/components/schemas/ExplicitGroupSummary'}
    ExplicitGroupSummary:
      type: object
      additionalProperties: false
      required: [id, label, ordinal, memberCount]
      properties:
        id: {type: string, minLength: 1}
        label: {type: string, minLength: 1}
        ordinal: {type: integer, format: int64, minimum: 0}
        memberCount: {type: integer, format: int64, minimum: 0}
    RawJSON:
      description: JSON whose existing shape is preserved losslessly during route cutover.
      type: object
      additionalProperties: true
    GenerationStatusResponse:
      type: object
      additionalProperties: false
      required: [project, generation, state, reusable]
      properties:
        project: {type: string}
        generation: {type: string}
        state: {type: string}
        reusable: {type: boolean}
    GenerationActivationResponse:
      type: object
      additionalProperties: false
      required: [project, generation, dataframeExecutionId, activated]
      properties:
        project: {type: string}
        generation: {type: string}
        dataframeExecutionId: {type: string}
        activated: {type: boolean}
    RecipeExecutionResponse:
      type: object
      additionalProperties: false
      required: [id, projectId, datasetGeneration, recipeDigest, schemaDigest, resolvedSchemaDigest, state, outputs]
      properties:
        id: {type: string}
        projectId: {type: string}
        datasetGeneration: {type: string}
        recipeDigest: {type: string}
        schemaDigest: {type: string}
        resolvedSchemaDigest: {type: string}
        state: {type: string}
        outputs:
          type: array
          items: {$ref: '#/components/schemas/RecipeExecutionOutput'}
    RecipeExecutionOutput:
      type: object
      additionalProperties: false
      required: [name, state, rowCount, columns]
      properties:
        name: {type: string}
        state: {type: string}
        rowCount: {type: integer, format: int64}
        columns:
          type: array
          items: {$ref: '#/components/schemas/RecipeExecutionColumn'}
    RecipeExecutionColumn:
      type: object
      additionalProperties: false
      required: [name, semanticPath, clickhouseType, logicalType, nullable, repeated, filterable, sortable, aggregatable]
      properties:
        name: {type: string}
        semanticPath: {type: string}
        clickhouseType: {type: string}
        logicalType: {type: string}
        nullable: {type: boolean}
        repeated: {type: boolean}
        filterable: {type: boolean}
        sortable: {type: boolean}
        aggregatable: {type: boolean}
    ServiceErrorResponse:
      description: Stable error envelope emitted by Loom's shared HTTP error mapper and snapshot routes.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ServiceErrorBody'
    ServiceErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        fieldPath:
          type: array
          items: {type: string}
        details:
          type: object
          nullable: true
          additionalProperties: true
        retryable: {type: boolean}
        requestId: {type: string}
    LegacyErrorResponse:
      description: Error envelope retained by legacy Explorer and recipe-execution routes.
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error:
          description: Either a legacy message string or a structured code/message object, depending on the route.
          oneOf:
            - {type: string}
            - $ref: '#/components/schemas/LegacyErrorBody'
    LegacyErrorBody:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    AuthoringCapability:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, operations, previewLimits, features]
      properties:
        apiVersion: {$ref: '#/components/schemas/APIVersion'}
        kind: {type: string, enum: [ExplorerAuthoringCapabilities]}
        operations:
          type: array
          items: {type: string, enum: [builder, suggestions, rowChange, preview, interpretationPreview, configuredColumnContext, interpretationCreate, publish, commands, reconcile]}
        previewLimits:
          type: array
          items: {type: integer, minimum: 1, maximum: 1000}
        features:
          $ref: '#/components/schemas/AuthoringFeatures'
    AuthoringFeatures:
      type: object
      additionalProperties: false
      required: [emissionFilters, emissionCharts, sharedFilters, fixedFilters, fileActions, deleteExplorer]
      properties:
        emissionFilters: {type: boolean}
        emissionCharts: {type: boolean}
        sharedFilters: {type: boolean}
        fixedFilters: {type: boolean}
        fileActions: {type: boolean}
        deleteExplorer: {type: boolean}
    InterpretationLibraryListResponse:
      type: object
      additionalProperties: false
      required: [project, libraries]
      properties:
        project: {type: string, minLength: 1}
        libraries:
          type: array
          items: {$ref: '#/components/schemas/InterpretationLibraryView'}
    InterpretationLibraryView:
      type: object
      additionalProperties: false
      required: [library]
      properties:
        library: {$ref: '#/components/schemas/InterpretationLibrary'}
        head:
          allOf:
            - $ref: '#/components/schemas/InterpretationRevision'
          nullable: true
    InterpretationLibrary:
      type: object
      additionalProperties: false
      required: [id, project, createdAt, updatedAt]
      properties:
        id: {type: string, minLength: 1}
        project: {type: string, minLength: 1}
        headRevisionId: {type: string, minLength: 1}
        headDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    InterpretationApplicability:
      type: object
      additionalProperties: false
      properties:
        resourceTypes: {type: array, items: {type: string, minLength: 1}}
        sourceProfiles: {type: array, items: {type: string, minLength: 1}}
        sourceCanonical: {type: array, items: {type: string, minLength: 1}}
        logicalTypes: {type: array, items: {type: string, minLength: 1}}
        cardinalities: {type: array, items: {type: string, minLength: 1}}
        schemaDigests: {type: array, items: {type: string, minLength: 1}}
    InterpretationStructuralMatch:
      type: object
      additionalProperties: false
      properties:
        resourceType: {type: string}
        sourceProfile: {type: string}
        sourceCanonical: {type: string}
        owningScope: {type: string}
        system: {type: string}
        code: {type: string}
        extensionUrlPath: {type: array, items: {type: string, minLength: 1}}
        logicalType: {type: string}
        cardinality: {type: string}
    InterpretationFeatureDefinition:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: {$ref: '#/components/schemas/ColumnSource'}
        contributor: {$ref: '#/components/schemas/ContributorPredicate'}
    InterpretationRule:
      type: object
      additionalProperties: false
      required: [id, match, definition]
      properties:
        id: {type: string, minLength: 1}
        priority: {type: integer, format: int32}
        match: {$ref: '#/components/schemas/InterpretationStructuralMatch'}
        definition: {$ref: '#/components/schemas/InterpretationFeatureDefinition'}
    InterpretationRevision:
      type: object
      additionalProperties: false
      required: [id, project, libraryId, contentDigest, applicability, rules, author, explanation, createdAt]
      properties:
        id: {type: string, minLength: 1}
        project: {type: string, minLength: 1}
        libraryId: {type: string, minLength: 1}
        parentRevisionId: {type: string, minLength: 1}
        parentDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        contentDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        applicability: {$ref: '#/components/schemas/InterpretationApplicability'}
        rules:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/InterpretationRule'}
        author: {type: string, minLength: 1}
        explanation: {type: string, minLength: 1}
        createdAt: {type: string, format: date-time}
    InterpretationRevisionCreateRequest:
      type: object
      additionalProperties: false
      required: [libraryId, applicability, rules, explanation]
      properties:
        libraryId: {type: string, minLength: 1}
        parentRevisionId: {type: string, minLength: 1}
        applicability: {$ref: '#/components/schemas/InterpretationApplicability'}
        rules:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/InterpretationRule'}
        explanation: {type: string, minLength: 1}
    ConfiguredColumnContextRequest:
      type: object
      additionalProperties: false
      required: [snapshotToken, expectedDraftVersion, expectedDraftDigest]
      properties:
        snapshotToken: {type: string, minLength: 1}
        expectedDraftVersion: {type: integer, format: int64, minimum: 1}
        expectedDraftDigest: {type: string, minLength: 1}
    InterpretationRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, libraryId, contentDigest, author, explanation, createdAt]
      properties:
        id: {type: string, minLength: 1}
        libraryId: {type: string, minLength: 1}
        contentDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        author: {type: string, minLength: 1}
        explanation: {type: string, minLength: 1}
        createdAt: {type: string, format: date-time}
    InterpretationLibrarySummary:
      type: object
      additionalProperties: false
      required: [id, updatedAt]
      properties:
        id: {type: string, minLength: 1}
        headRevisionId: {type: string, minLength: 1}
        headDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        head:
          allOf:
            - $ref: '#/components/schemas/InterpretationRevisionSummary'
          nullable: true
        updatedAt: {type: string, format: date-time}
    ConfiguredColumnReadyResolution:
      type: object
      additionalProperties: false
      required: [state, capabilityCandidateIds, applicableRevisionIds]
      properties:
        state: {type: string, enum: [READY]}
        capabilityCandidateIds:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        applicableRevisionIds:
          type: array
          items: {type: string, minLength: 1}
    ConfiguredColumnUnavailableResolution:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        state: {type: string, enum: [MISSING, AMBIGUOUS, UNSUPPORTED]}
        reason: {type: string, minLength: 1}
    ConfiguredColumnResolution:
      oneOf:
        - $ref: '#/components/schemas/ConfiguredColumnReadyResolution'
        - $ref: '#/components/schemas/ConfiguredColumnUnavailableResolution'
      discriminator:
        propertyName: state
        mapping:
          READY: '#/components/schemas/ConfiguredColumnReadyResolution'
          MISSING: '#/components/schemas/ConfiguredColumnUnavailableResolution'
          AMBIGUOUS: '#/components/schemas/ConfiguredColumnUnavailableResolution'
          UNSUPPORTED: '#/components/schemas/ConfiguredColumnUnavailableResolution'
    ConfiguredColumnContext:
      type: object
      additionalProperties: false
      required: [outputId, column, occurrenceId, resolution]
      properties:
        outputId: {type: string, minLength: 1}
        column: {type: string, minLength: 1}
        occurrenceId: {type: string, minLength: 1}
        resolution: {$ref: '#/components/schemas/ConfiguredColumnResolution'}
    ConfiguredColumnContextResponse:
      type: object
      additionalProperties: false
      required: [snapshotToken, draftVersion, draftDigest, libraries, pinnedRevisions, columns]
      properties:
        snapshotToken: {type: string, minLength: 1}
        draftVersion: {type: integer, format: int64, minimum: 1}
        draftDigest: {type: string, minLength: 1}
        libraries:
          type: array
          items: {$ref: '#/components/schemas/InterpretationLibrarySummary'}
        pinnedRevisions:
          type: array
          items: {$ref: '#/components/schemas/InterpretationRevisionSummary'}
        columns:
          type: array
          items: {$ref: '#/components/schemas/ConfiguredColumnContext'}
    InterpretationRevisionFromColumnRequest:
      type: object
      additionalProperties: false
      required: [snapshotToken, expectedDraftVersion, expectedDraftDigest, outputId, column, libraryId, explanation]
      properties:
        snapshotToken: {type: string, minLength: 1}
        expectedDraftVersion: {type: integer, format: int64, minimum: 1}
        expectedDraftDigest: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        column: {type: string, minLength: 1}
        libraryId: {type: string, minLength: 1}
        parentRevisionId: {type: string, minLength: 1}
        explanation: {type: string, minLength: 1}
    InterpretationCandidatePayload:
      type: object
      additionalProperties: false
      required: [candidateReceiptId, revisionId]
      properties:
        candidateReceiptId: {type: string, minLength: 1}
        revisionId: {type: string, minLength: 1}
    InterpretationPreviewRequest:
      type: object
      additionalProperties: false
      required: [snapshotToken, expectedDraftVersion, expectedDraftDigest, outputId, column, revisionId]
      properties:
        snapshotToken: {type: string, minLength: 1}
        expectedDraftVersion: {type: integer, format: int64, minimum: 0}
        expectedDraftDigest: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        column: {type: string, minLength: 1}
        revisionId: {type: string, minLength: 1}
        limit: {type: integer, minimum: 1, maximum: 1000, default: 100}
    InterpretationPreviewSample:
      type: object
      additionalProperties: false
      required: [rowId, before, after, state]
      properties:
        rowId: {type: string, minLength: 1}
        before: {type: object, additionalProperties: true}
        after: {type: object, additionalProperties: true}
        state: {type: string, enum: [UNCHANGED, CHANGED, RESOLVED, UNRESOLVED]}
    InterpretationPreviewCounts:
      type: object
      additionalProperties: false
      required: [compared, changed, resolved, unresolved]
      properties:
        compared: {type: integer, minimum: 0}
        changed: {type: integer, minimum: 0}
        resolved: {type: integer, minimum: 0}
        unresolved: {type: integer, minimum: 0}
    InterpretationPreviewResponse:
      type: object
      additionalProperties: false
      required: [baseReceiptId, candidateReceiptId, outputId, column, revisionId, completeness, samples, counts]
      properties:
        baseReceiptId: {type: string, minLength: 1}
        candidateReceiptId: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        column: {type: string, minLength: 1}
        revisionId: {type: string, minLength: 1}
        completeness: {type: string, enum: [COMPLETE, INCOMPLETE]}
        samples:
          type: array
          items: {$ref: '#/components/schemas/InterpretationPreviewSample'}
        counts: {$ref: '#/components/schemas/InterpretationPreviewCounts'}
    APIVersion:
      type: string
      enum: [loom.calypr.org/explorer-authoring/v2]
    ProjectionMode:
      type: string
      enum: [SCALAR, INDEXED, FIRST, ARRAY, DISTINCT_ARRAY, VALUE, ALL, DISTINCT]
    Workspace:
      type: object
      x-go-type: authoringv2.Workspace
      x-go-type-import:
        path: github.com/calypr/loom/internal/explorer/authoringv2
        name: authoringv2
      additionalProperties: false
      required: [apiVersion, kind, explorer, documents, tabs]
      properties:
        apiVersion: {$ref: '#/components/schemas/APIVersion'}
        kind: {type: string, enum: [ExplorerBuilderWorkspace]}
        semanticsVersion: {type: integer, minimum: 1}
        explorer: {$ref: '#/components/schemas/ExplorerMetadata'}
        documents:
          type: array
          items: {$ref: '#/components/schemas/Document'}
        tabs:
          type: array
          items: {$ref: '#/components/schemas/Tab'}
        sharedFilters:
          type: object
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/SharedFilterBinding'}
        fileActions: {$ref: '#/components/schemas/FileActions'}
    ExplorerMetadata:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
    Tab:
      type: object
      additionalProperties: false
      required: [id, title, outputId, order, visible]
      properties:
        id: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
        title: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        order: {type: integer, minimum: 0}
        visible: {type: boolean}
    Document:
      type: object
      additionalProperties: false
      required: [kind, output, rootResourceType, route, rows, columns]
      properties:
        kind: {type: string, enum: [ExplorerBuilderDocument]}
        output: {$ref: '#/components/schemas/Output'}
        rootResourceType: {type: string, minLength: 1}
        route: {$ref: '#/components/schemas/RouteNode'}
        rows: {$ref: '#/components/schemas/RowDefinition'}
        population: {$ref: '#/components/schemas/Population'}
        columns:
          type: array
