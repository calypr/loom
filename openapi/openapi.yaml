      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [RECORDS]}
    RowDefinitionFieldGroupSelection:
      type: object
      additionalProperties: false
      required: [kind, fieldGroup]
      properties:
        kind: {type: string, enum: [FIELD_GROUP]}
