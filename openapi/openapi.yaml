        status: {type: string, enum: [AVAILABLE]}
        base: {$ref: '#/components/schemas/RowDefinitionPreviewSummary'}
        candidate: {$ref: '#/components/schemas/RowDefinitionPreviewSummary'}
        affectedColumns:
          type: array
          items: {type: string}
        notices:
          type: array
          items: {type: string}
        examples:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/RowDefinitionComparisonExample'}
    RowDefinitionComparisonUnavailable:
      type: object
      additionalProperties: false
      required: [status, reasonCode, reason, affectedColumns, notices, examples]
      properties:
        status: {type: string, enum: [UNAVAILABLE]}
        reasonCode: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        base: {$ref: '#/components/schemas/RowDefinitionPreviewSummary'}
        candidate: {$ref: '#/components/schemas/RowDefinitionPreviewSummary'}
        affectedColumns:
          type: array
          items: {type: string}
        notices:
          type: array
          items: {type: string}
        examples:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/RowDefinitionComparisonExample'}
    RowDefinitionComparison:
      oneOf:
        - {$ref: '#/components/schemas/RowDefinitionComparisonAvailable'}
        - {$ref: '#/components/schemas/RowDefinitionComparisonUnavailable'}
