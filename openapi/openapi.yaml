        transformations: {$ref: '#/components/schemas/AggregateTransformationCapabilities'}
        repeatedBoundaries:
          type: array
          items: {$ref: '#/components/schemas/RepeatedBoundary'}
        constructionChoice: {$ref: '#/components/schemas/ConstructionChoice'}
