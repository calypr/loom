        column: {type: string, minLength: 1}
        authoredColumn: {type: string, minLength: 1}
        occurrenceId: {type: string, minLength: 1}
        label: {type: string, minLength: 1}
        logicalType: {type: string, minLength: 1}
        sourceResourceType: {type: string}
        sourcePath: {type: string}
        projectionMode: {type: string}
        lossless: {type: boolean}
        lossReasons:
          type: array
          items: {type: string}
    CellTraceResponse:
      type: object
      additionalProperties: false
      required: [binding, feature, trace]
      properties:
        binding: {$ref: '#/components/schemas/CellTraceBinding'}
        feature: {$ref: '#/components/schemas/CellTraceFeature'}
        trace: {$ref: '#/components/schemas/CellTraceTrace'}
    PopulationMappingRequest:
      type: object
      additionalProperties: false
      required: [receiptId, outputId]
      properties:
        receiptId: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        cursor: {type: string}
        limit: {type: integer, minimum: 1, maximum: 1000}
    PopulationMappingCounts:
      type: object
      additionalProperties: false
      required: [selected, mapped, unmapped, emittedRows]
      properties:
        selected: {type: integer, format: int64, minimum: 0}
        mapped: {type: integer, format: int64, minimum: 0}
        unmapped: {type: integer, format: int64, minimum: 0}
        emittedRows: {type: integer, format: int64, minimum: 0}
    PopulationMappingBinding:
      type: object
      additionalProperties: false
      required: [receiptId, outputId, project, explorerId, generation, scopeDigest, selectionRevisionId, membershipDigest, resourceType]
      properties:
        receiptId: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        project: {type: string, minLength: 1}
        explorerId: {type: string, minLength: 1}
        generation: {type: string, minLength: 1}
        scopeDigest: {type: string, minLength: 1}
        selectionRevisionId: {type: string, minLength: 1}
        membershipDigest: {type: string, minLength: 1}
        resourceType: {type: string, minLength: 1}
    PopulationMappingResponse:
      type: object
      additionalProperties: false
      required: [binding, status, unmapped, diagnostics]
      properties:
        binding: {$ref: '#/components/schemas/PopulationMappingBinding'}
        status: {type: string, enum: [COMPLETE, INCOMPLETE]}
        counts:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PopulationMappingCounts'
        unmapped:
          type: array
          items: {$ref: '#/components/schemas/SelectionResourceRef'}
        nextCursor: {type: string}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
    ArtifactPrepareRequest:
      type: object
      additionalProperties: false
      required: [revisionId, outputId, idempotencyKey]
      properties:
        revisionId: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        idempotencyKey: {type: string, minLength: 1, maxLength: 200}
    Artifact:
      type: object
      additionalProperties: false
      required: [id, project, explorerId, revisionId, outputId, receiptId, executionId, datasetGeneration, schemaDigest, state, format, filename, mediaType, archiveSha256, bytes, rows, features, createdAt, completedAt, expiresAt]
      properties:
        id: {type: string, pattern: '^artifact_[0-9a-f]{64}$'}
        project: {type: string, minLength: 1}
        explorerId: {type: string, minLength: 1}
        revisionId: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        receiptId: {type: string, minLength: 1}
        executionId: {type: string, minLength: 1}
        datasetGeneration: {type: string, minLength: 1}
        schemaDigest: {type: string, minLength: 1}
        state: {type: string, enum: [COMPLETE]}
        format: {type: string, enum: [CSV, JSONL]}
        filename: {type: string, minLength: 1}
        mediaType: {type: string, enum: [application/zip]}
        archiveSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        bytes: {type: integer, format: int64, minimum: 1}
        rows: {type: integer, format: int64, minimum: 0}
        features: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    PublishRequest:
      type: object
      additionalProperties: false
      required: [receiptId]
      properties:
        receiptId: {type: string, minLength: 1}
    PublicationOutput:
      type: object
      additionalProperties: false
      required: [outputId, state, materializationId]
      properties:
        outputId: {type: string, minLength: 1}
        state: {type: string, minLength: 1}
        materializationId: {type: string, minLength: 1}
    PublishResponse:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, receiptId, revisionId, state, outputs, diagnostics]
      properties:
        apiVersion: {$ref: '#/components/schemas/APIVersion'}
        kind: {type: string, enum: [ExplorerBuilderPublication]}
        receiptId: {type: string, minLength: 1}
        revisionId: {type: string, minLength: 1}
        state: {type: string, minLength: 1}
        outputs:
          type: array
          items: {$ref: '#/components/schemas/PublicationOutput'}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, stage, code, message]
      properties:
        severity: {type: string, minLength: 1}
        stage: {type: string, minLength: 1}
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
        jsonPath: {type: string}
        message: {type: string, minLength: 1}
        details:
          type: object
          additionalProperties: true
        requestId: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
    ErrorBody:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        requestId: {type: string}
        diagnostic: {$ref: '#/components/schemas/Diagnostic'}
