            propertyName: kind
            mapping:
              RECORDS: '#/components/schemas/RowDefinitionRecordsSelection'
              FIELD_GROUP: '#/components/schemas/RowDefinitionFieldGroupSelection'
              EXPLICIT_GROUP: '#/components/schemas/RowDefinitionExplicitGroupSelection'
              EXPANDED: '#/components/schemas/RowDefinitionExpandedSelection'
