          type: array
          items: {$ref: '#/components/schemas/ConstructionRouteStep'}
        presentation: {$ref: '#/components/schemas/ConstructionChoicePresentation'}
        options:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ConstructionChoiceOption'}
    ConstructionChoiceOption:
      type: object
      additionalProperties: false
      required: [form, shape, decision, preservation, rowEffect, support, reason]
      properties:
        form: {type: string, enum: [VALUE, FIRST, ALL, DISTINCT, OWNER_RECORDS]}
        shape: {type: string, enum: [SCALAR, LIST]}
        decision: {type: string, enum: [DEFAULT, REQUIRES_DECISION]}
        preservation: {type: string, enum: [PRESERVING, REDUCING]}
        rowEffect: {type: string, enum: [PRESERVES_ROW_GRAIN]}
        support: {type: string, enum: [SUPPORTED]}
        reason: {type: string, minLength: 1}
    FieldChoiceSource:
      type: object
      additionalProperties: false
      required: [kind, candidateId, nodeId, resourceType, path, cardinality]
      properties:
        kind: {type: string, enum: [FIELD]}
        candidateId: {type: string, minLength: 1}
        nodeId: {type: string, minLength: 1}
        resourceType: {type: string, minLength: 1}
        path: {type: string, minLength: 1}
        cardinality: {type: string}
        repeatedBoundaries:
          type: array
          items: {$ref: '#/components/schemas/RepeatedBoundary'}
    SemanticBindingChoiceSource:
      type: object
      additionalProperties: false
      required: [kind, conceptId, bindingId, candidateId, nodeId, resourceType, sourcePath, fieldPath, valueSelector, logicalType, ruleVersion, schemaVersion, cardinality]
      properties:
        kind: {type: string, enum: [SEMANTIC]}
        conceptId: {type: string, minLength: 1}
        bindingId: {type: string, minLength: 1}
        candidateId: {type: string, minLength: 1}
        nodeId: {type: string, minLength: 1}
        resourceType: {type: string, minLength: 1}
        sourcePath: {type: string, minLength: 1}
        sourceCanonical: {type: string}
        sourceProfile: {type: string}
        fieldPath: {type: string, minLength: 1}
        owningScope: {type: string}
        extensionUrlPath:
          type: array
          items: {type: string}
        keySelector: {type: string}
        system: {type: string}
        version: {type: string}
        code: {type: string}
        valueSelector: {type: string, minLength: 1}
        choiceArm: {type: string}
        logicalType: {type: string, minLength: 1}
        ruleHint: {type: string}
        ruleVersion: {type: string, minLength: 1}
        schemaVersion: {type: integer, minimum: 1}
        cardinality: {type: string}
        repeatedBoundaries:
          type: array
          items: {$ref: '#/components/schemas/RepeatedBoundary'}
    ConceptCandidate:
      type: object
      additionalProperties: false
      required: [sourceResourceType, completeness, status, population]
      properties:
        sourceResourceType: {type: string}
        sourceCanonical: {type: string}
        sourceProfile: {type: string}
        sourcePath: {type: string}
        owningScope: {type: string}
        extensionUrlPath:
          type: array
          items: {type: string}
        keySelector: {type: string}
        system: {type: string}
        code: {type: string}
        display: {type: string}
        valueSelector: {type: string}
        choiceArm: {type: string}
        logicalType: {type: string}
        observedUnits:
          type: array
          items: {type: string}
        observedUnitsTruncated: {type: boolean}
        completeness: {type: string}
        status: {type: string}
        population: {type: integer, format: int64, minimum: 0}
        examples:
          type: array
          items: {type: string}
        examplesTruncated: {type: boolean}
        ruleHint: {type: string}
        ruleVersion: {type: string}
    RepeatedBoundary:
      type: object
      additionalProperties: false
      required: [path, maxItems]
      properties:
        path: {type: string, minLength: 1}
        maxItems: {type: integer, minimum: 0}
    RepeatedCoordinate:
      type: object
      additionalProperties: false
      required: [boundaryPath, index, width]
      properties:
        boundaryPath: {type: string, minLength: 1}
        index: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1}
