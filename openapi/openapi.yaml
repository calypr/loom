          type: object
          additionalProperties: false
          required: [rowChoiceId, missingKeyPolicy]
          properties:
            rowChoiceId: {type: string, minLength: 1}
            missingKeyPolicy: {type: string, enum: [ERROR, EXCLUDE, GROUP_AS_MISSING]}
    RowDefinitionExplicitGroupSelection:
      type: object
      additionalProperties: false
      required: [kind, explicitGroup]
      properties:
        kind: {type: string, enum: [EXPLICIT_GROUP]}
