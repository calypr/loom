        codedValueRecoding: {$ref: '#/components/schemas/ValueTransformationCapability'}
    ConstructionChoice:
      type: object
      additionalProperties: false
      required: [choiceId, source, route, presentation, options]
      properties:
        choiceId: {type: string, minLength: 1, maxLength: 16384}
