        operation: {type: string, enum: [COUNT, COUNT_DISTINCT, DISTINCT_VALUES, EXISTS, MIN, MAX, SUM, MEAN, CONTAINS_ALL, REQUIRE_ONE, COLLECT, FIRST_ORDERED]}
        rowContext: {type: string, enum: [RECORDS, GROUPS, EXPANDED]}
        supported: {type: boolean}
        reasonCode: {type: string}
        reason: {type: string}
        resultLogicalType: {type: string}
