        name: authoringv2
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, records]
          properties:
            kind: {type: string, enum: [RECORDS]}
            records: {type: object, additionalProperties: false}
        - type: object
          additionalProperties: false
          required: [kind, groups]
          properties:
            kind: {type: string, enum: [GROUPS]}
            groups:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [kind, field]
                      properties:
                        kind: {type: string, enum: [FIELD]}
                        field:
                          type: object
                          additionalProperties: false
                          required: [occurrenceId, fieldPath, missingKeyPolicy]
                          properties:
                            occurrenceId: {type: string, minLength: 1}
                            fieldPath: {type: string, minLength: 1}
                            missingKeyPolicy: {type: string, enum: [ERROR, EXCLUDE, GROUP_AS_MISSING]}
                    - type: object
                      additionalProperties: false
                      required: [kind, explicit]
                      properties:
                        kind: {type: string, enum: [EXPLICIT]}
                        explicit:
                          type: object
                          additionalProperties: false
                          required: [revisionId, unassignedMemberPolicy]
                          properties:
                            revisionId: {type: string, minLength: 1}
                            unassignedMemberPolicy: {type: string, enum: [ERROR, EXCLUDE, GROUP_AS_UNASSIGNED]}
                  discriminator:
                    propertyName: kind
        - type: object
          additionalProperties: false
          required: [kind, expanded]
          properties:
            kind: {type: string, enum: [EXPANDED]}
            expanded:
              type: object
              additionalProperties: false
              required: [occurrenceId, scopePath, emptyCollectionPolicy]
              properties:
                occurrenceId: {type: string, minLength: 1}
                scopePath: {type: string, minLength: 1}
                emptyCollectionPolicy: {type: string, enum: [ERROR, EXCLUDE, PRESERVE_PARENT]}
      discriminator:
