      type: object
      additionalProperties: false
      required: [rowIdentity, basePresent, candidatePresent]
      properties:
        rowIdentity: {type: string, minLength: 1}
        basePresent: {type: boolean}
        candidatePresent: {type: boolean}
    RowDefinitionComparisonAvailable:
      type: object
      additionalProperties: false
      required: [status, base, candidate, affectedColumns, notices, examples]
