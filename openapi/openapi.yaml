        outputId: {type: string, minLength: 1}
        snapshotToken: {type: string, minLength: 1}
        draftVersion: {type: integer, minimum: 1}
        draftDigest: {type: string, minLength: 1}
        baseDocumentDigest: {type: string, minLength: 1}
        candidateWorkspaceDigest: {type: string, minLength: 1}
        mode: {type: string, enum: [RECORDS, FIELD_GROUP, EXPLICIT_GROUP, EXPANDED]}
