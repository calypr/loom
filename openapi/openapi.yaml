      properties:
        snapshotToken: {type: string, minLength: 1}
        draftVersion: {type: integer, minimum: 1}
        draftDigest: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        stageId: {type: string, minLength: 1}
        baseConstruction: {$ref: '#/components/schemas/Construction'}
        stages:
          type: array
          items: {$ref: '#/components/schemas/ConstructionStageDescriptor'}
        selectedStage: {$ref: '#/components/schemas/ConstructionStageDescriptor'}
    ConstructionProposalRequest:
      type: object
      additionalProperties: false
      required: [snapshotToken, expectedDraftVersion, expectedDraftDigest, outputId, candidateConstruction]
      properties:
        snapshotToken: {type: string, minLength: 1}
        expectedDraftVersion: {type: integer, minimum: 1}
        expectedDraftDigest: {type: string, minLength: 1}
        outputId: {type: string, minLength: 1}
        changedStepId: {type: string}
        removeStepIds:
          type: array
          items: {type: string, minLength: 1}
        candidateConstruction: {$ref: '#/components/schemas/Construction'}
        limit: {type: integer, minimum: 1, maximum: 1000}
    ConstructionProposalResponse:
      type: object
      additionalProperties: false
      required: [outputId, snapshotToken, draftVersion, draftDigest, baseDocumentDigest, candidateWorkspaceDigest, changedStepId, candidateConstruction, dependencyImpact, stages, previewStatus, previewDurationMs]
      properties:
        proposalId: {type: string, minLength: 1}
        baseReceiptId: {type: string, minLength: 1}
