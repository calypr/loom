name: Builder Verification Contracts

on:
  pull_request:
    paths:
      - '**/*.mjs'
      - 'verification/builder-interactions/**'
      - 'scripts/maintenance/playwright/tests/**'
      - 'scripts/maintenance/playwright/run_browser_evidence_tests_parallel.py'
      - 'docs/ui-contract-inventory/**'
      - 'internal/**'
      - 'ui/packages/loom-ui/src/features/ExplorerBuilder/**'
      - '.github/workflows/builder-formal.yml'
      - '.github/workflows/builder-contracts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    name: Builder contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Validate model parsing and runtime receipts
        run: node --test scripts/build-test-obligations.test.mjs
      - name: Check retained browser evidence
        run: |
          node scripts/generate-builder-browser-evidence.mjs --self-test
          node scripts/generate-builder-browser-evidence.mjs --from-evidence --check
      - name: Exercise retained browser evidence controls
        run: python3 scripts/maintenance/playwright/run_browser_evidence_tests_parallel.py
      - name: Exercise maintenance checker controls
        run: node --test scripts/maintenance/playwright/check-native-playwright.test.mjs scripts/maintenance/playwright/check-browser-eval-returns.test.mjs scripts/maintenance/playwright/tests/browser-callback-scope.test.mjs
      - name: Exercise evidence bootstrap and temporal oracle controls
        run: |
          node --test scripts/verify-ui/helpers/tests/generate-builder-browser-evidence-bootstrap.test.mjs
          node --test scripts/verify-ui/helpers/tests/basic-temporal-filter-oracle-negative.test.mjs
      - name: Generate local obligation index
        run: node scripts/build-test-obligations.mjs
      - name: Validate derived obligation report
        run: node scripts/build-test-obligations.mjs --check
