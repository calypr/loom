name: Builder CDA Mini Journeys

on:
  pull_request:
    paths:
      - '.github/workflows/builder-cda-mini.yml'
      - 'compose.dev.yaml'
      - 'scripts/fixtures/generate-cda-mini-fixture.mjs'
      - 'scripts/loom-dev.mjs'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - 'scripts/run-builder-journey.mjs'
      - 'scripts/run-cda-mini-journeys.sh'
      - 'scripts/verify-ui/journey-specs/**'
      - 'testdata/cda-mini-fixture/**'
      - 'ui/packages/loom-ui/src/features/ExplorerBuilder/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cda-mini:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOOM_DEV_COMPOSE_PROJECT: loom-dev-cda-mini-${{ github.run_id }}
      LOOM_DEV_PROJECT: loom_dev_cda_mini_${{ github.run_id }}
      LOOM_DEV_API_PORT: 8380
      LOOM_DEV_UI_PORT: 3380
      LOOM_DEV_ARTIFACTS: .artifacts/builder-cda-mini/${{ github.run_id }}
      LOOM_CDA_MINI_ARTIFACTS: .artifacts/builder-journey/cda-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install scripts dependencies
        working-directory: scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe runner Chrome through Playwright
        id: chrome_probe
        working-directory: scripts
        shell: bash
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({
            channel: 'chrome',
            headless: true,
          });
          await browser.close();
          console.log('PASS Playwright launched and closed runner Chrome');
          NODE
      - name: Install Playwright Chrome fallback
        if: steps.chrome_probe.outcome != 'success'
        working-directory: scripts
        run: npx playwright install --with-deps chrome
      - name: Verify generated CDA mini fixture is current
        run: |
          node scripts/fixtures/generate-cda-mini-fixture.mjs
          git diff --exit-code -- testdata/cda-mini-fixture
      - name: Start the development stack
        run: node scripts/loom-dev.mjs verify-fast
      - name: Run CDA mini journeys
        run: bash scripts/run-cda-mini-journeys.sh
      - name: Clean up the development stack
        if: always()
        continue-on-error: true
        run: node scripts/loom-dev.mjs dev-down --purge
      - name: Upload CDA mini journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-cda-mini-${{ github.run_id }}
          path: |
            .artifacts/builder-cda-mini
            .artifacts/builder-journey/cda-mini
          if-no-files-found: warn
