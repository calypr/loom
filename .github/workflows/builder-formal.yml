name: Builder Formal Verification

on:
  pull_request:
    paths:
      - '.github/workflows/builder-formal.yml'
      - 'scripts/verify-builder-formal-core.mjs'
      - 'scripts/lib/formal-*.mjs'
      - 'scripts/setup-formal-tools.mjs'
      - 'scripts/browser/**'
      - 'verification/builder-interactions/**'
      - '.codex/skills/builder-interaction-formal-verification/**'
      - 'verification/builder-interactions/BuilderLifecycle.*'
      - 'verification/builder-interactions/ReconcileLifecycle.*'
      - 'verification/builder-interactions/ImplementationConformance.*'
      - 'verification/builder-interactions/ApplySettlementRace.*'
      - 'verification/builder-interactions/statechart.view.mjs'
      - 'ui/packages/loom-ui/src/**'
      - 'ui/packages/loom-ui/testSupport/**'
      - 'ui/packages/loom-ui/vitest*'
      - 'ui/package*.json'
      - 'internal/explorer/lifecycle/construction_category_discovery.go'
  workflow_dispatch:
    inputs:
      browser:
        description: Run opt-in native Chromium component checks
        type: boolean
        default: false

jobs:
  audit:
    name: Formal ${{ matrix.phase }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { phase: all, shard: '' }
          - { phase: controls, shard: '1/2' }
          - { phase: controls, shard: '2/2' }
          - { phase: source-proofs, shard: '1/3' }
          - { phase: source-proofs, shard: '2/3' }
          - { phase: source-proofs, shard: '3/3' }
          - { phase: trace-controls, shard: '1/2' }
          - { phase: trace-controls, shard: '2/2' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bootstrap pinned formal tools
        run: node scripts/setup-formal-tools.mjs
      - name: Check framework rejection paths
        run: node --test scripts/lib/formal-framework.test.mjs
      - name: Check scoped promises and controls
        env:
          FORMAL_PHASE: ${{ matrix.phase }}
          FORMAL_SHARD: ${{ matrix.shard }}
        run: |
          args=(--phase "$FORMAL_PHASE" --out /tmp/loom-formal-ci)
          if [ -n "$FORMAL_SHARD" ]; then args+=(--shard "$FORMAL_SHARD"); fi
          node scripts/verify-builder-formal-core.mjs "${args[@]}"
      - name: Check UI types
        if: matrix.phase == 'all'
        working-directory: ui/packages/loom-ui
        run: timeout 30s ../../node_modules/.bin/tsc -p tsconfig.test.json
      - name: Preserve formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-${{ strategy.job-index }}
          path: /tmp/loom-formal-ci
          if-no-files-found: warn

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    name: Native Chromium component boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI build dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Drive actual components and verify downloads
        run: node scripts/verify-builder-formal-core.mjs --phase browser --chrome "$(command -v google-chrome)" --out /tmp/loom-native-browser
      - name: Preserve browser observations and cleanup proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser
          path: /tmp/loom-native-browser
          if-no-files-found: warn
