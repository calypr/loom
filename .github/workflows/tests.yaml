name: Go Tests

on:
  workflow_call:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: loom_test
          CLICKHOUSE_USER: loom_ci
          CLICKHOUSE_PASSWORD: loom_ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      LOOM_CLICKHOUSE_URL: clickhouse://127.0.0.1:9000
      LOOM_CLICKHOUSE_DATABASE: loom_test
      LOOM_CLICKHOUSE_USERNAME: loom_ci
      LOOM_CLICKHOUSE_PASSWORD: loom_ci_password

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.5
        cache: true

    - name: Generate FHIR code
      run: make generate-fhir

    - name: Generate GraphQL code
      run: make generate-graphql

    - name: Check generated code is current
      run: git diff --exit-code -- generated/fhir generated/fhirschema generated/graphql

    - name: Run GraphQL contract checks
      run: make graphql-check

    - name: Run Go tests
      run: make test

    - name: Build server image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: loom:ci
