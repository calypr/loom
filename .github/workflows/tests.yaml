name: Tests

on:
  workflow_call:

jobs:
  ui-unit:
    name: UI checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check reviewed UI source checkpoint
        run: python3 scripts/verify_ui_contract_inventory.py --source-only
      - name: Check UI boundaries
        working-directory: ui
        run: npm run check-boundaries
      - name: Type-check UI tests
        working-directory: ui
        run: npm run typecheck:tests --workspace @calypr/loom-ui
      - name: Check feature attachments
        run: node scripts/verify-builder-formal-core.mjs --phase behavior --list
      - name: Run all UI behavioral tests
        run: node scripts/verify-builder-formal-core.mjs --phase behavior --out "$RUNNER_TEMP/loom-ui-behavior"
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Preserve behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-behavior
          path: ${{ runner.temp }}/loom-ui-behavior
          if-no-files-found: warn

  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Install ripgrep for the boundary check
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ripgrep
          fi
          rg --version | head -1
      - name: Run Go package boundary check
        run: bash scripts/check_dataframe_package_boundaries.sh
      - name: Backend ownership guard named gates
        run: |
          set -o pipefail
          go test -json -count=1 -timeout=600s ./internal/dataframe/compiler \
            -run '^(TestBackendOwnershipGuardContract|TestCompilerProductionFilesNeverImportBackendsOrDrivers)$' \
            | node scripts/lib/check-go-test-events.mjs \
                TestBackendOwnershipGuardContract \
                TestBackendOwnershipGuardContract/compiler_backends_and_drivers \
                TestBackendOwnershipGuardContract/neutral_domain_backend_import \
                TestBackendOwnershipGuardContract/renderer_runtime_import \
                TestBackendOwnershipGuardContract/legitimate_adapter_domain_import \
                TestBackendOwnershipGuardContract/actual_relocated_adapter_import \
                TestBackendOwnershipGuardContract/missing_or_malformed_input_is_error \
                TestBackendOwnershipGuardContract/facade_law_control_plane \
                TestCompilerProductionFilesNeverImportBackendsOrDrivers \
                TestCompilerProductionFilesNeverImportBackendsOrDrivers/non_vacuity_named_victims_bleed \
                TestCompilerProductionFilesNeverImportBackendsOrDrivers/non_vacuity_fires_on_a_real_postgres_adapter \
                TestCompilerProductionFilesNeverImportBackendsOrDrivers/non_vacuity_fires_on_a_real_arango_adapter \
                TestCompilerProductionFilesNeverImportBackendsOrDrivers/non_vacuity_malformed_input_is_verification_failure
      - name: Run all ordinary Go packages and catalog witnesses
        run: |
          package_list=$(go list . ./internal/... ./cmd/... ./generated/... ./conformance/...)
          mapfile -t packages < <(printf '%s\n' "$package_list" | grep -vE '/(compiler/render/clickhouse|published|store/clickhouse)$')
          test "${#packages[@]}" -gt 0
          go test -timeout=10m -count=1 "${packages[@]}"

  go-arango:
    name: Actual Arango integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_NO_AUTH: '1'
        ports:
          - 8529:8529
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://127.0.0.1:8529/_api/version"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Exercise isolated graph and repository profiles
        env:
          LOOM_TEST_ARANGO_URL: http://127.0.0.1:8529
        run: node scripts/run-arango-integration.mjs --out "$RUNNER_TEMP/arango-proof"
      - name: Verify actual derived arithmetic policy source faults
        env:
          LOOM_TEST_ARANGO_URL: http://127.0.0.1:8529
        run: node scripts/lib/formal-derived-policy.mjs --out "$RUNNER_TEMP/derived-policy-proof"
      - name: Preserve actual Arango proof and external gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arango-proof
          path: |
            ${{ runner.temp }}/arango-proof
            ${{ runner.temp }}/derived-policy-proof
          if-no-files-found: warn

  go-publication-rows:
    name: Compiled publication rows across Arango and ClickHouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_NO_AUTH: '1'
        ports:
          - 8529:8529
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://127.0.0.1:8529/_api/version"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: loom_test
          CLICKHOUSE_USER: loom_ci
          CLICKHOUSE_PASSWORD: loom_ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LOOM_TEST_ARANGO_URL: http://127.0.0.1:8529
      LOOM_CLICKHOUSE_URL: clickhouse://127.0.0.1:9000
      LOOM_CLICKHOUSE_DATABASE: loom_test
      LOOM_CLICKHOUSE_USERNAME: loom_ci
      LOOM_CLICKHOUSE_PASSWORD: loom_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Compile server tests separately from runtime proof
        run: go test -timeout=10m -run '^$' ./internal/server
      - name: Verify literal compiled and stored rows through fresh Viewer
        run: node scripts/verify-builder-formal-core.mjs --phase api --feature publication-rows --out "$RUNNER_TEMP/publication-proof"
      - name: Verify active release tables survive cleanup races
        run: node scripts/verify-builder-formal-core.mjs --phase api --feature release-dangle-reconcile --out "$RUNNER_TEMP/release-dangle-proof"
      - name: Verify current draft APPEND rows and actual source faults
        run: node scripts/lib/formal-append-rows.mjs --out "$RUNNER_TEMP/append-proof"
      - name: Preserve current draft APPEND evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: append-rows
          path: ${{ runner.temp }}/append-proof
          if-no-files-found: warn
      - name: Preserve active release cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-dangle-reconcile
          path: ${{ runner.temp }}/release-dangle-proof
          if-no-files-found: warn
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-rows
          path: ${{ runner.temp }}/publication-proof
          if-no-files-found: warn

  go-clickhouse:
    name: Go ClickHouse integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: loom_test
          CLICKHOUSE_USER: loom_ci
          CLICKHOUSE_PASSWORD: loom_ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LOOM_CLICKHOUSE_URL: clickhouse://127.0.0.1:9000
      LOOM_CLICKHOUSE_DATABASE: loom_test
      LOOM_CLICKHOUSE_USERNAME: loom_ci
      LOOM_CLICKHOUSE_PASSWORD: loom_ci_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Run ClickHouse tests
        run: >-
          go test -timeout=10m -count=1
          ./internal/dataframe/compiler/render/clickhouse
          ./internal/dataframe/published
          ./internal/store/clickhouse

  pg-fixture:
    name: PostgreSQL 18 opt-in fixture runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres18:
        image: postgres:18
        env:
          POSTGRES_DB: loom_test
          POSTGRES_USER: loom_test
          POSTGRES_PASSWORD: loom_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U loom_test -d loom_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom_test:loom_ci_test_only@127.0.0.1:5432/loom_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Run fixture runner coverage without any service
        run: timeout 180s node --test scripts/run-postgres-integration.test.mjs
      - name: Run owned-namespace real PostgreSQL acceptance
        run: timeout 540s node scripts/run-postgres-integration.mjs --out "$RUNNER_TEMP/pg-fixture"
      - name: Preserve fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-fixture
          path: ${{ runner.temp }}/pg-fixture
          if-no-files-found: warn

  pg-repository-publish:
    name: PostgreSQL repository-publish spine across PostgreSQL 18 and ClickHouse
    runs-on: ubuntu-latest
    # Acceptance lane for the repository publish spine: the POST
    # explorer-config route runs real ClickHouse materialization between
    # compile and the second-CAS activation flip, so this job is the only
    # environment where the spine leg is honest. Both services are job-local
    # and ephemeral: the loom_test ClickHouse database is created per job, so
    # the leg never touches shared state.
    timeout-minutes: 10
    services:
      postgres18:
        image: postgres:18
        env:
          POSTGRES_DB: loom_test
          POSTGRES_USER: loom_test
          POSTGRES_PASSWORD: loom_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U loom_test -d loom_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: loom_test
          CLICKHOUSE_USER: loom_ci
          CLICKHOUSE_PASSWORD: loom_ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom_test:loom_ci_test_only@127.0.0.1:5432/loom_test?sslmode=disable
      LOOM_CLICKHOUSE_URL: clickhouse://127.0.0.1:9000
      LOOM_CLICKHOUSE_DATABASE: loom_test
      LOOM_CLICKHOUSE_USERNAME: loom_ci
      LOOM_CLICKHOUSE_PASSWORD: loom_ci_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Run the pgComp battery with the repository-publish spine leg
        # The spine leg shares the pgComp census, mint inventory, and
        # TestZZ zero-leftover audit with the rest of the battery, so the
        # battery contract must be invoked whole. With ClickHouse configured
        # the gated-mint inventory holds the spine leg to its one database.
        run: |
          set -euo pipefail
          go test -timeout=8m -count=1 -v \
            -run 'TestPostgresRuntime|TestPostgreSQL|TestHealthWiringPerCompositionArm|TestBackendCompositionContract|TestZZPgCompZeroLeftoverFixtures' \
            ./internal/server \
            | tee "$RUNNER_TEMP/pg-repository-publish.log"
      - name: Assert the spine leg executed and never skipped
        # Silent-skip is a red gate: the acceptance proof is the PASS line
        # for the spine leg, and any SKIP of it means an env wiring regress.
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pg-repository-publish.log"
          grep -q -- '--- PASS: TestPostgresRuntimeRepositoryPublishRouteActivatesThroughFinalFlip' "$log"
          if grep -q -- '--- SKIP: TestPostgresRuntimeRepositoryPublishRouteActivatesThroughFinalFlip' "$log"; then
            echo '::error/repository-publish spine leg skipped despite both live services being configured'
            exit 1
          fi
          grep -q -- '--- PASS: TestPostgresRuntimeRepositoryPublishRetryAfterActivationFailureRevives' "$log"
          if grep -q -- '--- SKIP: TestPostgresRuntimeRepositoryPublishRetryAfterActivationFailureRevives' "$log"; then
            echo '::error/repository-publish retry-revival leg skipped despite both live services being configured'
            exit 1
          fi
      - name: Preserve spine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-repository-publish
          path: ${{ runner.temp }}/pg-repository-publish.log
          if-no-files-found: warn

  backend-conformance:
    name: Backend architecture conformance across Arango and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_NO_AUTH: '1'
        ports:
          - 8529:8529
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://127.0.0.1:8529/_api/version"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
      postgres18:
        image: postgres:18
        env:
          POSTGRES_DB: loom_test
          POSTGRES_USER: loom_test
          POSTGRES_PASSWORD: loom_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U loom_test -d loom_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
    env:
      LOOM_TEST_ARANGO_URL: http://127.0.0.1:8529
      LOOM_TEST_POSTGRES_URL: postgresql://loom_test:loom_ci_test_only@127.0.0.1:5432/loom_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Verify the offline skip-set capture against the frozen allowlist
        run: env -u LOOM_TEST_ARANGO_URL -u LOOM_TEST_POSTGRES_URL node scripts/backend-conformance-skipset-verify.mjs
      - name: Run both conformance arms against the actual services
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/backend-conformance"
          status=0
          timeout 480s go test -json -count=1 -timeout=420s ./internal/server \
            -run '^TestBackendArchitectureConformance$' \
            > "$RUNNER_TEMP/backend-conformance/conformance.jsonl" || status=$?
          node scripts/lib/check-go-test-events.mjs \
              TestBackendArchitectureConformance \
              TestBackendArchitectureConformance/arangodb \
              TestBackendArchitectureConformance/arangodb/scalarQueryServesLiteralScalars \
              TestBackendArchitectureConformance/arangodb/repeatedRelatedOccurrenceStaysDistinct \
              TestBackendArchitectureConformance/arangodb/nullAndMissingSemanticsPreserved \
              TestBackendArchitectureConformance/arangodb/explicitScopeServesAuthorizedAndExcludesUnauthorized \
              TestBackendArchitectureConformance/arangodb/restrictedEmptyScopeServesNothing \
              TestBackendArchitectureConformance/arangodb/unrestrictedSeesEverything \
              TestBackendArchitectureConformance/arangodb/generationIsolationServesActiveOnly \
              TestBackendArchitectureConformance/arangodb/stablePagingIsDeterministic \
              TestBackendArchitectureConformance/arangodb/explorerDraftCASOneWinnerExactPreimage \
              TestBackendArchitectureConformance/arangodb/publicationControlFenceRejectsStaleOwner \
              TestBackendArchitectureConformance/arangodb/cancellationTypedFailureNoFallback \
              TestBackendArchitectureConformance/arangodb/backendUnavailableAndWrongTagNoFallback \
              TestBackendArchitectureConformance/arangodb/upgradeFromPinnedPreRefactorReopensSafely \
              TestBackendArchitectureConformance/postgresql \
              TestBackendArchitectureConformance/postgresql/scalarQueryServesLiteralScalars \
              TestBackendArchitectureConformance/postgresql/repeatedRelatedOccurrenceStaysDistinct \
              TestBackendArchitectureConformance/postgresql/nullAndMissingSemanticsPreserved \
              TestBackendArchitectureConformance/postgresql/explicitScopeServesAuthorizedAndExcludesUnauthorized \
              TestBackendArchitectureConformance/postgresql/restrictedEmptyScopeServesNothing \
              TestBackendArchitectureConformance/postgresql/unrestrictedSeesEverything \
              TestBackendArchitectureConformance/postgresql/generationIsolationServesActiveOnly \
              TestBackendArchitectureConformance/postgresql/stablePagingIsDeterministic \
              TestBackendArchitectureConformance/postgresql/explorerDraftCASOneWinnerExactPreimage \
              TestBackendArchitectureConformance/postgresql/publicationControlFenceRejectsStaleOwner \
              TestBackendArchitectureConformance/postgresql/cancellationTypedFailureNoFallback \
              TestBackendArchitectureConformance/postgresql/backendUnavailableAndWrongTagNoFallback \
              TestBackendArchitectureConformance/postgresql/upgradeFromPinnedPreRefactorReopensSafely \
              TestBackendArchitectureConformance/crossBackendCandidateIdentityParity \
              < "$RUNNER_TEMP/backend-conformance/conformance.jsonl" || status=$?
          # The gate fails closed on events alone; surface the failing tests'
          # own output so a red lane is diagnosable from this step's log.
          node -e '
            const fs = require("node:fs");
            const events = fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean).map(JSON.parse);
            const outputs = new Map();
            const failed = [];
            for (const e of events) {
              if (e.Test && e.Action === "output") outputs.set(e.Test, [...(outputs.get(e.Test) ?? []), e.Output]);
              if (e.Action === "fail" && e.Test) failed.push(e.Test);
            }
            for (const name of failed) for (const line of outputs.get(name) ?? []) process.stdout.write(line);
            if (failed.length === 0 && events.some(e => e.Action === "fail")) console.error("package-level failure with no named failing test; see conformance.jsonl artifact");
          ' "$RUNNER_TEMP/backend-conformance/conformance.jsonl" || true
          exit $status
      - name: Preserve conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-conformance
          path: ${{ runner.temp }}/backend-conformance
          if-no-files-found: warn

  node-unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record executable routes and fail on a broken retained closure
        run: node scripts/verify-builder-formal-core.mjs --phase inventory --out "$RUNNER_TEMP"
      - name: Preserve verification inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-inventory
          path: ${{ runner.temp }}/verification-inventory.json
          if-no-files-found: error
      - name: Run retained non-Playwright tests
        run: |
          export LOOM_E2E_CHROME="$(command -v google-chrome)"
          test -n "$LOOM_E2E_CHROME"
          test_list=$(node scripts/ci/list-node-tests.mjs)
          test -n "$test_list"
          mapfile -t tests <<< "$test_list"
          node --test --test-timeout=600000 "${tests[@]}"

  shell-unit:
    name: Shell cleanup tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run acceptance cleanup tests
        run: timeout 600s bash scripts/tests/test_acceptance_real_cleanup.sh

  python-unit:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout architecture plan history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Run retained Python tests
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest scripts.test_validate_architecture_plan

  contracts:
    name: Generated and OpenAPI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - name: Generate FHIR code
        run: timeout 600s make generate-fhir
      - name: Generate GraphQL code
        run: timeout 600s make generate-graphql
      - name: Generate Loom OpenAPI code
        run: timeout 600s make generate-openapi
      - name: Check generated code is current
        run: |
          timeout 600s git diff --exit-code -- generated/fhir generated/fhirschema generated/graphql generated/loomapi
          timeout 600s sh -c 'test -z "$(git status --porcelain --untracked-files=all -- generated)"'
      - name: Check OpenAPI route ownership
        run: timeout 600s make openapi-check
      - name: Check preview-index migration
        run: >-
          go test -timeout=10m -count=1
          ./scripts/local-preview-index-migration.go
          ./scripts/local-preview-index-migration_test.go
      - name: Check FHIR semantic resource types
        run: timeout 600s go run ./scripts/check_fhir_semantic_resource_types.go
      - name: Test FHIR semantic resource checks
        run: >-
          timeout 600s go test -timeout=10m -count=1
          ./scripts/check_fhir_semantic_resource_types.go
          ./scripts/check_fhir_semantic_resource_types_test.go
