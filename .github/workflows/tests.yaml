name: Tests

on:
  workflow_call:

jobs:
  ui-unit:
    name: UI checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check UI boundaries
        working-directory: ui
        run: npm run check-boundaries
      - name: Type-check UI tests
        working-directory: ui
        run: npm run typecheck:tests --workspace @calypr/loom-ui
      - name: Run all UI behavioral tests
        working-directory: ui
        run: npm run test --workspace @calypr/loom-ui -- --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Preserve Vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: ${{ runner.temp }}/vitest.json
          if-no-files-found: warn

  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true
      - name: Check Go comments
        run: make lint-go-comments
      - name: Record Go test names
        run: go test -list . ./... > "$RUNNER_TEMP/go-test-list.txt"
      - name: Preserve Go test names
        uses: actions/upload-artifact@v4
        with:
          name: go-test-list
          path: ${{ runner.temp }}/go-test-list.txt
      - name: Run all ordinary Go packages and catalog witnesses
        run: |
          package_list=$(go list . ./internal/... ./cmd/... ./api/... ./fhir/... ./tests/conformance/...)
          mapfile -t packages < <(printf '%s\n' "$package_list" | grep -vE '/(compiler/render/clickhouse|published|store/clickhouse)$')
          test "${#packages[@]}" -gt 0
          go test -timeout=10m -count=1 "${packages[@]}"

      - name: Test standalone HTTP client
        working-directory: client
        run: go test -race -timeout=2m ./...

  go-arango:
    name: Actual Arango integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_NO_AUTH: '1'
        ports:
          - 8529:8529
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://127.0.0.1:8529/_api/version"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: loom_test
          CLICKHOUSE_USER: loom_ci
          CLICKHOUSE_PASSWORD: loom_ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LOOM_CLICKHOUSE_URL: clickhouse://127.0.0.1:9000
      LOOM_CLICKHOUSE_DATABASE: loom_test
      LOOM_CLICKHOUSE_USERNAME: loom_ci
      LOOM_CLICKHOUSE_PASSWORD: loom_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Exercise isolated graph and repository profiles
        env:
          LOOM_TEST_ARANGO_URL: http://127.0.0.1:8529
        run: node scripts/run-arango-integration.mjs --out "$RUNNER_TEMP/arango-proof"
      - name: Verify derived arithmetic policies against Arango
        env:
          LOOM_TEST_ARANGO_URL: http://127.0.0.1:8529
        run: go test -json -timeout=10m -count=1 -run '^TestDerivedArithmeticPoliciesAgainstArango$' ./internal/dataframe/execution/arango | node tests/scripts/assert-go-tests.mjs TestDerivedArithmeticPoliciesAgainstArango

  go-publication-rows:
    name: Compiled publication rows across Arango and ClickHouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      arangodb:
        image: arangodb:3.12
        env:
          ARANGO_NO_AUTH: '1'
        ports:
          - 8529:8529
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://127.0.0.1:8529/_api/version"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: loom_test
          CLICKHOUSE_USER: loom_ci
          CLICKHOUSE_PASSWORD: loom_ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LOOM_TEST_ARANGO_URL: http://127.0.0.1:8529
      LOOM_CLICKHOUSE_URL: clickhouse://127.0.0.1:9000
      LOOM_CLICKHOUSE_DATABASE: loom_test
      LOOM_CLICKHOUSE_USERNAME: loom_ci
      LOOM_CLICKHOUSE_PASSWORD: loom_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Compile publication and execution tests separately from runtime proof
        run: go test -timeout=10m -run '^$' ./internal/api/explorer ./internal/dataframe/execution
      - name: Verify literal compiled and stored rows through fresh Viewer
        run: go test -json -timeout=10m -count=1 -run '^TestPublicationRowsAndFreshViewerAgainstArangoClickHouse$' ./internal/api/explorer | node tests/scripts/assert-go-tests.mjs TestPublicationRowsAndFreshViewerAgainstArangoClickHouse
      - name: Verify active release tables survive cleanup races
        run: go test -json -timeout=10m -count=1 -run '^TestReconcileDanglesActiveReleaseAgainstArangoClickHouse$' ./internal/dataframe/publication/arango | node tests/scripts/assert-go-tests.mjs TestReconcileDanglesActiveReleaseAgainstArangoClickHouse
      - name: Verify current draft APPEND rows
        run: go test -json -timeout=10m -count=1 -run '^TestCurrentDraftAppendRowsAgainstArangoClickHouse$' ./internal/dataframe/execution | node tests/scripts/assert-go-tests.mjs TestCurrentDraftAppendRowsAgainstArangoClickHouse

  go-clickhouse:
    name: Go ClickHouse integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_DB: loom_test
          CLICKHOUSE_USER: loom_ci
          CLICKHOUSE_PASSWORD: loom_ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LOOM_CLICKHOUSE_URL: clickhouse://127.0.0.1:9000
      LOOM_CLICKHOUSE_DATABASE: loom_test
      LOOM_CLICKHOUSE_USERNAME: loom_ci
      LOOM_CLICKHOUSE_PASSWORD: loom_ci_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true
      - name: Run ClickHouse tests
        run: >-
          go test -timeout=10m -count=1
          ./internal/dataframe/compiler/render/clickhouse
          ./internal/dataframe/published
          ./internal/store/clickhouse

  script-tests:
    name: Repository script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run retained non-Playwright tests
        run: |
          export LOOM_E2E_CHROME="$(command -v google-chrome)"
          test -n "$LOOM_E2E_CHROME"
          test_list=$(node scripts/ci/list-node-tests.mjs)
          test -n "$test_list"
          mapfile -t tests <<< "$test_list"
          node --test --test-timeout=600000 "${tests[@]}"

      - name: Run acceptance cleanup tests
        if: ${{ !cancelled() }}
        run: timeout 600s bash tests/scripts/test_acceptance_real_cleanup.sh

      - name: Run retained Python tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests/scripts

  contracts:
    name: Generated and OpenAPI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache: true
      - name: Generate FHIR code
        run: timeout 600s make generate-fhir
      - name: Generate Loom OpenAPI code
        run: timeout 600s make generate-openapi
      - name: Check generated code is current
        run: |
          timeout 600s git diff --exit-code -- fhir/model fhir/schema api/loomapi
          timeout 600s sh -c 'test -z "$(git status --porcelain --untracked-files=all -- api/loomapi fhir/model fhir/schema)"'
      - name: Check OpenAPI route ownership
        run: timeout 600s make openapi-check
      - name: Check preview-index migration
        run: >-
          timeout 600s bash tests/scripts/test-go-script.sh local-preview-index-migration -timeout=10m -count=1
      - name: Check FHIR semantic resource types
        run: timeout 600s go run ./scripts/check_fhir_semantic_resource_types.go
      - name: Test FHIR semantic resource checks
        run: >-
          timeout 600s bash tests/scripts/test-go-script.sh check_fhir_semantic_resource_types -timeout=10m -count=1

  component-browser:
    name: Chromium component boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI build dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Drive actual preview, download and saved-route components
        run: node scripts/browser/run.mjs --chrome "$(command -v google-chrome)" --out "$RUNNER_TEMP/native-browser"
      - name: Preserve component results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser
          path: ${{ runner.temp }}/native-browser
          if-no-files-found: warn
