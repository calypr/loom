name: Go Tests

on: [ pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'

    - name: Generate FHIR code
      run: make generate-fhir

    - name: Run GraphQL contract checks
      run: make graphql-check

    - name: Run Go tests
      run: make test
