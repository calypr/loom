\* Defense-in-depth pair: the default branch (:372-374) is unreachable while
\* prune enforces the owners registry, so firing it needs the registry fault
\* too. Both faults => an unowned-step projection ships unconsumed.
CONSTANTS
  FPruneDropsSurviving = FALSE
  FPruneKeepsOrphan = TRUE
  FPruneIgnoresUsed = FALSE
  FBranchIgnoresPivotGroup = FALSE
  FBranchIgnoresFilter = FALSE
  FBranchIgnoresDerive = FALSE
  FBranchIgnoresUnpivot = FALSE
  FBranchIgnoresDefault = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ShippedRequiresConsumption
