services:
  arangodb:
    image: arangodb:3.12
    container_name: arangodb-proto
    environment:
      ARANGO_NO_AUTH: "1"
    ports:
      - "8529:8529"
    volumes:
      - ./data:/var/lib/arangodb3

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: loom-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse

  postgres18-test:
    profiles: ["postgres-test"]
    image: postgres:18
    container_name: loom-postgres18-test
    environment:
      POSTGRES_DB: loom_test
      POSTGRES_USER: loom_test
      POSTGRES_PASSWORD: loom-test-only
    ports:
      - "55432:5432"
    volumes:
      - loom-pg18-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U loom_test -d loom_test"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  loom-pg18-test-data:
