services:
  arangodb:
    image: arangodb:3.12
    container_name: arangodb-proto
    environment:
      ARANGO_NO_AUTH: "1"
    ports:
      - "8529:8529"
    volumes:
      - ./data:/var/lib/arangodb3

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: loom-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse

  # Opt-in PostgreSQL 18 test fixture for Loom integration checks. The
  # default developer stack above stays Arango + ClickHouse only; this
  # service starts only with an explicit profile, e.g.
  #   docker compose -f experimental/docker-compose.yml --profile postgres-test up -d postgres18-test
  # then:
  #   export LOOM_TEST_POSTGRES_URL='postgresql://loom_test:loom-test-only@127.0.0.1:55432/loom_test?sslmode=disable'
  #   node scripts/run-postgres-integration.mjs --out "$(mktemp -d)"
  # The credentials below are throwaway test-only values for this disposable
  # container, not production secrets. Data lives in the isolated named
  # volume loom-pg18-test-data (removed by `down -v`), never a bind mount.
  # Tests own their namespace: node scripts/run-postgres-integration.mjs
  # creates and drops only its uniquely-named pgfixture_* database, so
  # repeated setups are deterministic and never touch shared user data.
  postgres18-test:
    profiles: ["postgres-test"]
    image: postgres:18
    container_name: loom-postgres18-test
    environment:
      POSTGRES_DB: loom_test
      POSTGRES_USER: loom_test
      POSTGRES_PASSWORD: loom-test-only
    ports:
      - "55432:5432"
    volumes:
      - loom-pg18-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U loom_test -d loom_test"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  loom-pg18-test-data:
